<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altri Chart — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@300;400;500;600;700&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f;--card:#0e0e1c;--card2:#0a0a16;
  --border:rgba(201,162,39,0.12);--border-hi:rgba(201,162,39,0.25);
  --gold:#c9a227;--gold-hi:#e8c547;--gold-dim:rgba(201,162,39,0.10);
  --text:#e8e0d0;--muted:#8a8098;--dim:#5a5470;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh}

.header-action{position:absolute;top:16px;right:20px;z-index:2}
.btn-back{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-radius:6px;border:1px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;text-decoration:none;display:inline-block;transition:all 0.2s}
.btn-back:hover{background:var(--gold);color:#07070f}
.page-header{position:relative;text-align:center;padding:36px 160px 28px}
.page-header img{width:64px;height:64px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(201,162,39,0.3));border-radius:8px}
.page-season{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.page-title{font-family:'Russo One',sans-serif;font-size:clamp(24px,5vw,36px);color:var(--text);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}
.page-sub{font-family:'Teko',sans-serif;font-size:14px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}

.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}

.loading{text-align:center;padding:60px 20px}
.loading-bar{width:240px;height:6px;background:rgba(201,162,39,0.10);border-radius:3px;margin:16px auto 0;overflow:hidden}
.loading-fill{height:100%;background:var(--gold);border-radius:3px;width:0%;transition:width 0.3s}
.loading-text{font-family:'Teko',sans-serif;font-size:16px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:10px}

.section-title{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-label{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-right:4px}
.filter-pill{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);color:var(--muted);cursor:pointer;transition:all 0.15s;background:transparent}
.filter-pill:hover{border-color:rgba(201,162,39,0.3);color:var(--text)}
.filter-pill.active{background:var(--gold-dim);border-color:rgba(201,162,39,0.3);color:var(--gold-hi)}

/* PILOT LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.06);transition:all 0.15s;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);user-select:none;}
.legend-item:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
.legend-item.active{border-color:rgba(255,255,255,0.25);color:var(--text)}
.legend-item.inactive{opacity:0.35}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* CHART CONTAINER */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:24px;position:relative}
.chart-scroll{overflow-x:auto;overflow-y:hidden;cursor:grab;-webkit-overflow-scrolling:touch}
.chart-scroll:active{cursor:grabbing}
.chart-scroll::-webkit-scrollbar{height:5px}
.chart-scroll::-webkit-scrollbar-track{background:var(--bg)}
.chart-scroll::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}

.chart-inner{display:flex}
/* Y axis labels */
.y-axis{flex-shrink:0;width:36px;padding-top:40px;padding-bottom:20px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--border)}
.y-label{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:1px;color:var(--dim);text-align:right;padding-right:6px;line-height:1}

/* CANVAS WRAP */
.canvas-wrap{position:relative;flex:1}
canvas#raceChart{display:block}

/* TOOLTIP */
.chart-tooltip{position:fixed;background:rgba(14,14,28,0.97);border:1px solid var(--border-hi);border-radius:8px;padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text);pointer-events:none;z-index:1000;display:none;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,0.6)}
.tt-circuit{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.tt-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.tt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tt-name{flex:1}
.tt-pos{font-family:'Russo One',sans-serif;font-size:13px}
.tt-arrow{font-size:11px;font-weight:700}

/* KM TABLE */
.km-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto;margin-bottom:32px}
.km-table{width:100%;border-collapse:collapse;min-width:500px}
.km-table thead{background:rgba(201,162,39,0.06)}
.km-table th{font-family:'Teko',sans-serif;font-size:13px;font-weight:500;letter-spacing:2px;color:var(--gold);text-transform:uppercase;padding:10px 14px;text-align:center;border-bottom:1px solid var(--border-hi);white-space:nowrap}
.km-table th:nth-child(2){text-align:left}
.km-table td{padding:10px 14px;font-size:14px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.03);color:#ffffff;white-space:nowrap}
.km-table td:nth-child(2){text-align:left;color:var(--text);font-weight:500}
.km-table tbody tr:hover{background:rgba(201,162,39,0.04)}
.pos-gold{color:var(--gold);font-family:'Russo One',sans-serif;font-weight:700}
.pos-dim{color:var(--dim)}
.km-val{color:var(--gold-hi);font-family:'Russo One',sans-serif;font-weight:700;font-size:15px}
.km-bar-wrap{height:5px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;margin-top:4px}
.km-bar{height:100%;background:linear-gradient(90deg,rgba(201,162,39,0.5),rgba(232,197,71,0.8));border-radius:3px}

.footer-note{text-align:center;font-size:12px;letter-spacing:2px;color:rgba(201,184,163,0.3);margin-top:20px}

@media(max-width:700px){
  .page-header{padding:36px 20px 28px}
  .header-action{position:static;text-align:right;margin-bottom:10px}
}
</style>
</head>
<body>

<header class="page-header">
  <div class="header-action"><a href="statistiche.html" class="btn-back">← Statistiche</a></div>
  <a href="index.html"><img src="etna-logo.jpg" alt="Etna Racing Club"></a>
  <div class="page-season">Etna Racing Club</div>
  <h1 class="page-title">Altri Chart</h1>
  <div class="page-sub">Progressione gara per gara &middot; Chilometri percorsi</div>
</header>

<div class="wrap">

  <div class="loading" id="loadingBox">
    <div style="font-family:'Russo One',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px">Caricamento dati...</div>
    <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
    <div class="loading-text" id="loadingText">Recupero risultati...</div>
  </div>

  <div id="dashboard" style="display:none">

    <!-- RACE PROGRESSION CHART -->
    <div class="section-title">📈 Posizione gara per gara</div>

    <!-- Pilot status filter -->
    <div class="filter-bar" id="pilotFilterBar" style="margin-bottom:8px">
      <span class="filter-label">Piloti:</span>
      <button class="filter-pill active" id="pf-tutti"   onclick="setPilotFilter('tutti',this)">Tutti</button>
      <button class="filter-pill"        id="pf-attivi"  onclick="setPilotFilter('attivi',this)">🟢 Attivi</button>
      <button class="filter-pill"        id="pf-inattivi" onclick="setPilotFilter('inattivi',this)">⚫ Non Attivi</button>
    </div>
    <!-- Championship category + individual filter -->
    <div class="filter-bar race-filter-bar">
      <span class="filter-label">Gare:</span>
      <button class="filter-pill active" onclick="setChampFilter('all',this)">Tutte</button>
      <button class="filter-pill" onclick="setChampFilter('cat:Campionato',this)">🏆 Campionati</button>
      <button class="filter-pill" onclick="setChampFilter('cat:Trofeo',this)">🎖️ Trofei</button>
      <button class="filter-pill" onclick="setChampFilter('cat:Evento',this)">🎯 Eventi</button>
      <button class="filter-pill" onclick="setChampFilter('cat:Formula',this)">🏎️ Formula</button>
      <div id="champFilterPills" style="display:contents"></div>
    </div>

    <div class="legend" id="pilotLegend"></div>

    <div class="chart-card">
      <div class="chart-inner">
        <div class="y-axis" id="yAxis"></div>
        <div class="chart-scroll" id="chartScroll">
          <div class="canvas-wrap">
            <canvas id="raceChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- KM TABLE -->
    <div class="section-title" style="margin-top:8px">🛣️ Chilometri percorsi (esclusi DNF/DSQ)</div>
    <div class="km-table-wrap">
      <table class="km-table">
        <thead>
          <tr>
            <th style="width:44px">#</th>
            <th>Pilota</th>
            <th>Km Totali</th>
            <th>Gare</th>
            <th>Km / Gara</th>
          </tr>
        </thead>
        <tbody id="kmTableBody"></tbody>
      </table>
    </div>

    <div class="footer-note" id="footerNote"></div>
  </div>
</div>

<div class="chart-tooltip" id="chartTooltip"></div>

<script>
(function(){

var BASE = '';
var PILOT_COLORS = [
  '#e8c547','#4fc3f7','#ff5014','#27ae60','#9b59b6',
  '#e74c3c','#3498db','#2ecc71','#f39c12','#1abc9c',
  '#e91e63','#00bcd4','#ff9800','#8bc34a','#673ab7',
  '#ff5722','#607d8b','#cddc39','#795548','#ff4081',
  '#69f0ae','#40c4ff','#ffd740'
];

var allRaces = [];       // sorted by date
var pilotMap = {};       // pkey -> {nome, psn, color, active}
var schede   = {};       // psnLower -> currentNome
var pilotSchede = {};    // psnLower -> {nome, attivo}
var nmeToPsn = {};       // normNome -> psnLower
var ufficioseIds = {};
var champMeta = {};      // champId -> {name, year, cat}
var currentFilter = 'all';
var pilotFilter = 'tutti';
var champRoundsMap = {};

function norm(s){ return (s||'').toLowerCase().replace(/-/g,' ').trim(); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function extractKm(s){
  var m = (s||'').match(/[\-\u2013]\s*([\d,\.]+)\s*km/i);
  if(m) return parseFloat(m[1].replace(',','.'));
  var m2 = (s||'').match(/\(([\d,\.]+)\s*m\)/i);
  if(m2){ var v=parseFloat(m2[1]); return v>30 ? Math.round(v/1000*1000)/1000 : v; }
  return null;
}

function fetchPsnMap(){
  return fetch(BASE+'piloti_schede/psn-map.json?_='+Date.now())
    .then(function(r){return r.ok?r.json():{};})
    .then(function(m){ for(var k in m){if(m.hasOwnProperty(k)) schede[k.toLowerCase().trim()]=m[k];} })
    .catch(function(){});
}

function fetchPilotSchede(){
  return fetch(BASE+'piloti_schede/index.json?_='+Date.now())
    .then(function(r){return r.ok?r.json():[];})
    .then(function(list){
      return Promise.all(list.filter(function(f){return f.endsWith('.json')&&f!=='index.json'&&f!=='psn-map.json';}).map(function(f){
        return fetch(BASE+'piloti_schede/'+f+'?_='+Date.now())
          .then(function(r){return r.ok?r.json():null;})
          .then(function(d){
            if(!d) return;
            var psn=(d.psn||'').toLowerCase().trim();
            if(psn) pilotSchede[psn]={nome:d.nome||'',attivo:d.attivo!==false};
          }).catch(function(){});
      }));
    }).catch(function(){});
}

function fetchCalendario(){
  return fetch(BASE+'calendario.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(champs){
      champs.forEach(function(c){
        if(c.cat==='Gara Ufficiosa'){ if(c.id) ufficioseIds[c.id]=true; return; }
        if(c.id){
          champMeta[c.id]={name:c.name||c.id, year:c.year||'', cat:c.cat||''};
          champRoundsMap[c.id]=c.rounds||[];
        }
      });
    }).catch(function(){});
}

function fetchIndex(){
  return fetch(BASE+'risultati/index.json?_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(list){ return list.filter(function(f){return f!=='index.json'&&f.endsWith('.json');}); });
}

function fetchRace(file){
  return fetch(BASE+'risultati/'+file+'?_='+Date.now())
    .then(function(r){return r.ok?r.json():null;})
    .catch(function(){return null;});
}

function loadAll(){
  Promise.all([fetchCalendario(),fetchPsnMap(),fetchPilotSchede()])
    .then(function(){ return fetchIndex(); })
    .then(function(files){
      var total=files.length, done=0;
      return Promise.all(files.map(function(f){
        return fetchRace(f).then(function(d){
          done++;
          document.getElementById('loadingFill').style.width=Math.round(done/total*100)+'%';
          document.getElementById('loadingText').textContent=done+' / '+total+' risultati';
          return d;
        });
      }));
    })
    .then(function(races){
      processAndRender(races.filter(function(x){return x;}));
    })
    .catch(function(){ document.getElementById('loadingText').textContent='Errore nel caricamento'; });
}

function processAndRender(races){
  // Build nmeToPsn
  races.forEach(function(race){
    (race.rows||[]).forEach(function(r){
      var psn=(r.psn||'').toLowerCase().trim();
      if(psn && r.nome) nmeToPsn[norm(r.nome)]=psn;
    });
  });

  // Sort races by date then garaNum
  races.sort(function(a,b){
    var da=a.data||'', db=b.data||'';
    if(da!==db) return da.localeCompare(db);
    return (parseInt(a.garaNum)||0)-(parseInt(b.garaNum)||0);
  });

  // Skip ufficiose
  races = races.filter(function(r){
    var cid=r.champId||r.champIdx||'';
    return !(cid && ufficioseIds[cid]);
  });

  allRaces = races.map(function(race, idx){
    var cid = race.champId||race.champIdx||'';
    var cm = champMeta[cid]||{};
    var circ = (race.circuito||'').replace(/\s*[\-\u2013]\s*[\d,\.]+\s*km\s*$/i,'').trim();
    var rows = (race.rows||[]).map(function(r){
      var psn=(r.psn||'').toLowerCase().trim()||nmeToPsn[norm(r.nome||'')]||'';
      var pkey=psn||norm(r.nome||'');
      return { nome:r.nome||'', psn:psn, pkey:pkey, pos:r.pos, stato:(r.stato||'ok').toLowerCase() };
    });
    return {
      idx: idx,
      date: race.data||'',
      circuito: circ,
      garaNum: race.garaNum,
      garaTot: race.garaTot,
      champId: cid,
      champName: cm.name||cid,
      champYear: cm.year||'',
      champCat: cm.cat||'',
      rows: rows
    };
  });

  // Build pilot list
  var colorIdx=0;
  allRaces.forEach(function(race){
    race.rows.forEach(function(r){
      if(!r.pkey || !r.nome) return;
      if(!pilotMap[r.pkey]){
        var currentNome = (r.psn && schede[r.psn]) ? schede[r.psn] : r.nome;
        pilotMap[r.pkey] = { nome:currentNome, psn:r.psn, color:PILOT_COLORS[colorIdx++%PILOT_COLORS.length], active:true };
      }
    });
  });

  // KM calculation
  var pilotKm={};
  allRaces.forEach(function(race){
    var rounds=champRoundsMap[race.champId]||[];
    var garaNum=parseInt(race.garaNum)||0;
    var rd=garaNum>0&&garaNum<=rounds.length?rounds[garaNum-1]:null;
    if(!rd) return;
    var laps=parseInt(rd.laps)||0;
    if(!laps||rd.lapsType==='min') return;
    var km=extractKm(rd.circuit||race.circuito||'');
    if(!km) return;
    var raceKm=Math.round(laps*km*10)/10;
    race.rows.forEach(function(r){
      if(r.stato==='dnf'||r.stato==='dsq') return;
      if(!r.pkey||!r.nome) return;
      if(!pilotKm[r.pkey]) pilotKm[r.pkey]={nome:r.nome,psn:r.psn,km:0,races:0};
      if(r.psn&&schede[r.psn]) pilotKm[r.pkey].nome=schede[r.psn];
      pilotKm[r.pkey].km+=raceKm;
      pilotKm[r.pkey].races++;
    });
  });

  document.getElementById('loadingBox').style.display='none';
  document.getElementById('dashboard').style.display='';

  buildChampFilter();
  buildLegend();
  drawChart();
  renderKmTable(pilotKm);

  document.getElementById('footerNote').textContent=
    'Basato su '+allRaces.length+' gare pubblicate';
}

// ── CHAMP FILTER ──
function buildChampFilter(){
  var seen={}, pills='';
  allRaces.forEach(function(r){
    if(r.champId && !seen[r.champId]){
      seen[r.champId]=true;
      pills+='<button class="filter-pill" onclick="setChampFilter(\''+esc(r.champId)+'\',this)">'+esc(r.champName+(r.champYear?' '+r.champYear:''))+'</button>';
    }
  });
  document.getElementById('champFilterPills').innerHTML=pills;
}

function setChampFilter(val, btn){
  currentFilter=val;
  document.querySelectorAll('.race-filter-bar .filter-pill').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  drawChart();
}

function setPilotFilter(val, btn){
  pilotFilter=val;
  document.querySelectorAll('#pilotFilterBar .filter-pill').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  applyPilotFilter();
  drawChart();
}

function applyPilotFilter(){
  Object.keys(pilotMap).forEach(function(pkey){
    var p=pilotMap[pkey];
    var psn=(p.psn||'').toLowerCase().trim();
    var scheda=pilotSchede[psn]||null;
    var isActive=scheda?scheda.attivo!==false:true;
    var userOff=p.userActive===false;
    if(userOff){ p.active=false; }
    else if(pilotFilter==='attivi'&&!isActive){ p.active=false; }
    else if(pilotFilter==='inattivi'&&isActive){ p.active=false; }
    else{ p.active=true; }
    var el=document.querySelector('[data-pkey="'+esc(pkey)+'"]');
    if(el) el.classList.toggle('inactive',!p.active);
  });
}

function getFilteredRaces(){
  if(currentFilter==='all') return allRaces;
  if(currentFilter.indexOf('cat:')===0){
    var cat=currentFilter.slice(4);
    return allRaces.filter(function(r){return r.champCat===cat;});
  }
  return allRaces.filter(function(r){return r.champId===currentFilter;});
}

// ── LEGEND ──
function buildLegend(){
  var html='';
  Object.keys(pilotMap).sort(function(a,b){
    return pilotMap[a].nome.localeCompare(pilotMap[b].nome);
  }).forEach(function(pkey){
    var p=pilotMap[pkey];
    html+='<div class="legend-item active" data-pkey="'+esc(pkey)+'" onclick="togglePilot(\''+esc(pkey)+'\')" style="border-color:'+p.color+'33">'
      +'<div class="legend-dot" style="background:'+p.color+'"></div>'+esc(p.nome)+'</div>';
  });
  document.getElementById('pilotLegend').innerHTML=html;
}

function togglePilot(pkey){
  if(!pilotMap[pkey]) return;
  pilotMap[pkey].userActive = pilotMap[pkey].userActive===false ? true : false;
  applyPilotFilter();
  drawChart();
}

// ── DRAW CHART ──
var COL_W=72, ROW_H=36, PAD_TOP=48, PAD_BOT=24;

function drawChart(){
  var races=getFilteredRaces();
  if(!races.length) return;

  // Find max grid size for Y axis
  var maxPos=0;
  races.forEach(function(r){ maxPos=Math.max(maxPos, r.rows.length); });
  maxPos=Math.max(maxPos,1);

  var W=Math.max(races.length*COL_W, 400);
  var H=PAD_TOP + maxPos*ROW_H + PAD_BOT;

  // Build Y axis
  var yHtml='';
  for(var i=1;i<=maxPos;i++){
    yHtml+='<div class="y-label" style="height:'+ROW_H+'px;line-height:'+ROW_H+'px">'+i+'°</div>';
  }
  var yEl=document.getElementById('yAxis');
  yEl.style.paddingTop=PAD_TOP+'px';
  yEl.innerHTML=yHtml;

  var canvas=document.getElementById('raceChart');
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  ctx.lineWidth=1;
  for(var i=1;i<=maxPos;i++){
    var y=posToY(i,maxPos,H);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  // Vertical separators
  ctx.strokeStyle='rgba(255,255,255,0.04)';
  for(var i=0;i<races.length;i++){
    var x=raceToX(i);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }

  // Race labels (circuit name + round)
  ctx.fillStyle='rgba(201,162,39,0.5)';
  ctx.font='bold 9px Barlow Condensed, sans-serif';
  ctx.textAlign='center';
  races.forEach(function(race,i){
    var x=raceToX(i)+COL_W/2;
    var label=race.circuito.length>12?race.circuito.substring(0,11)+'…':race.circuito;
    var roundLabel='R'+race.garaNum+(race.garaTot>1?'/'+race.garaTot:'');
    ctx.fillStyle='rgba(201,162,39,0.35)';
    ctx.fillText(roundLabel, x, PAD_TOP-26);
    ctx.fillStyle='rgba(201,162,39,0.55)';
    ctx.fillText(label, x, PAD_TOP-12);
  });

  // Build data: pkey -> [{raceIdx, pos}]
  var pilotData={};
  races.forEach(function(race,ri){
    race.rows.forEach(function(r){
      if(!r.pkey||!pilotMap[r.pkey]) return;
      if(!pilotData[r.pkey]) pilotData[r.pkey]=[];
      pilotData[r.pkey].push({ri:ri, pos:r.pos, stato:r.stato, race:race});
    });
  });

  // Draw lines first (behind dots)
  Object.keys(pilotData).forEach(function(pkey){
    var p=pilotMap[pkey];
    if(!p||!p.active) return;
    var pts=pilotData[pkey].filter(function(d){return d.pos&&d.stato==='ok';});
    if(pts.length<2) return;
    ctx.strokeStyle=p.color;
    ctx.lineWidth=2;
    ctx.globalAlpha=0.7;
    ctx.beginPath();
    pts.forEach(function(d,i){
      var x=raceToX(d.ri)+COL_W/2;
      var y=posToY(d.pos,maxPos,H);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.globalAlpha=1;
  });

  // Draw dots + arrows
  Object.keys(pilotData).forEach(function(pkey){
    var p=pilotMap[pkey];
    if(!p||!p.active) return;
    var pts=pilotData[pkey];
    pts.forEach(function(d,i){
      if(!d.pos) return;
      var x=raceToX(d.ri)+COL_W/2;
      var y=posToY(d.pos,maxPos,H);
      var isFinished=d.stato==='ok';

      // Dot
      ctx.beginPath();
      ctx.arc(x,y,isFinished?5:4,0,Math.PI*2);
      ctx.fillStyle=isFinished?p.color:'rgba(150,150,150,0.4)';
      ctx.fill();
      if(!isFinished){
        ctx.strokeStyle='rgba(150,150,150,0.6)';
        ctx.lineWidth=1; ctx.stroke();
      }

      // Arrow if not first appearance and finished
      if(i>0 && isFinished && pts[i-1].pos && pts[i-1].stato==='ok'){
        var prevPos=pts[i-1].pos;
        var diff=prevPos-d.pos; // positive = went up (lower number = better)
        if(diff!==0){
          var arrow=diff>0?'▲':'▼';
          var arrowColor=diff>0?'#27ae60':'#e74c3c';
          ctx.fillStyle=arrowColor;
          ctx.font='bold 9px sans-serif';
          ctx.textAlign='center';
          ctx.fillText(arrow, x, y+(diff>0?-9:17));
        }
      }

      // DNF/DSQ tag
      if(d.stato==='dnf'||d.stato==='dsq'){
        ctx.fillStyle='rgba(255,80,20,0.7)';
        ctx.font='7px Barlow Condensed, sans-serif';
        ctx.textAlign='center';
        ctx.fillText(d.stato.toUpperCase(),x,y+14);
      }
    });
  });

  setupTooltip(races, pilotData, maxPos, H, canvas);
}

function posToY(pos,maxPos,H){
  var usable=H-PAD_TOP-PAD_BOT;
  return PAD_TOP + (pos-1)/(Math.max(maxPos-1,1))*usable;
}
function raceToX(ri){ return ri*COL_W; }

// ── TOOLTIP ──
function setupTooltip(races, pilotData, maxPos, H, canvas){
  var scroll=document.getElementById('chartScroll');
  var tooltip=document.getElementById('chartTooltip');
  var lastRi=-1;

  function onMove(e){
    var rect=canvas.getBoundingClientRect();
    var clientX=e.touches?e.touches[0].clientX:e.clientX;
    var clientY=e.touches?e.touches[0].clientY:e.clientY;
    var x=clientX-rect.left;
    var ri=Math.floor(x/COL_W);
    if(ri<0||ri>=races.length){ tooltip.style.display='none'; lastRi=-1; return; }
    if(ri===lastRi) return;
    lastRi=ri;
    var race=races[ri];

    // Build tooltip content
    var entries=[];
    Object.keys(pilotData).forEach(function(pkey){
      if(!pilotMap[pkey]||!pilotMap[pkey].active) return;
      var pts=pilotData[pkey];
      var d=pts.find(function(p){return p.ri===ri;});
      if(!d||!d.pos) return;
      var prevD=null;
      for(var j=0;j<pts.length;j++){
        if(pts[j].ri===ri&&j>0) prevD=pts[j-1];
      }
      var diff=prevD&&prevD.pos&&d.stato==='ok'&&prevD.stato==='ok'?prevD.pos-d.pos:null;
      entries.push({nome:pilotMap[pkey].nome, color:pilotMap[pkey].color, pos:d.pos, stato:d.stato, diff:diff});
    });
    entries.sort(function(a,b){return (a.pos||99)-(b.pos||99);});

    var html='<div class="tt-circuit">'+esc(race.circuito)+'</div>';
    if(race.champName) html+='<div style="font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:6px">'+esc(race.champName)+'</div>';
    entries.forEach(function(e){
      var arrow='', arrowColor='';
      if(e.diff!==null&&e.diff!==0){ arrow=e.diff>0?'▲':'▼'; arrowColor=e.diff>0?'#27ae60':'#e74c3c'; }
      var posStr=e.stato==='dnf'?'DNF':e.stato==='dsq'?'DSQ':e.pos+'°';
      html+='<div class="tt-row">'
        +'<div class="tt-dot" style="background:'+e.color+'"></div>'
        +'<div class="tt-name">'+esc(e.nome)+'</div>'
        +'<div class="tt-pos" style="color:'+e.color+'">'+posStr+'</div>'
        +(arrow?'<div class="tt-arrow" style="color:'+arrowColor+'">'+arrow+'</div>':'')
        +'</div>';
    });
    tooltip.innerHTML=html;
    tooltip.style.display='block';
    var tw=tooltip.offsetWidth, th=tooltip.offsetHeight;
    var tx=clientX+14, ty=clientY-th/2;
    if(tx+tw>window.innerWidth-10) tx=clientX-tw-14;
    if(ty<10) ty=10;
    tooltip.style.left=tx+'px'; tooltip.style.top=ty+'px';
  }

  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseleave', function(){ tooltip.style.display='none'; lastRi=-1; });
  canvas.addEventListener('touchmove', onMove, {passive:true});
  canvas.addEventListener('touchend', function(){ setTimeout(function(){tooltip.style.display='none';lastRi=-1;},1500); });
}

// ── KM TABLE ──
function renderKmTable(pilotKm){
  var arr=[];
  for(var k in pilotKm){ if(pilotKm.hasOwnProperty(k)) arr.push(pilotKm[k]); }
  arr.sort(function(a,b){return b.km-a.km;});
  var maxKm=arr.length?arr[0].km:1;
  var html='';
  arr.forEach(function(p,i){
    var posCls=i<3?'pos-gold':'pos-dim';
    var avgKm=p.races?Math.round(p.km/p.races*10)/10:0;
    var barW=Math.round(p.km/maxKm*100);
    html+='<tr>'
      +'<td class="'+posCls+'">'+(i+1)+'</td>'
      +'<td>'+esc(p.nome)+'</td>'
      +'<td><div class="km-val">'+p.km.toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})+' km</div>'
      +'<div class="km-bar-wrap"><div class="km-bar" style="width:'+barW+'%"></div></div></td>'
      +'<td>'+p.races+'</td>'
      +'<td>'+avgKm.toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})+' km</td>'
      +'</tr>';
  });
  document.getElementById('kmTableBody').innerHTML=html||'<tr><td colspan="5" style="text-align:center;color:var(--dim);padding:24px">Nessun dato</td></tr>';
}

// Drag to scroll
(function(){
  var el=document.getElementById('chartScroll');
  var isDown=false, startX, scrollLeft;
  el.addEventListener('mousedown',function(e){isDown=true;startX=e.pageX-el.offsetLeft;scrollLeft=el.scrollLeft;});
  el.addEventListener('mouseleave',function(){isDown=false;});
  el.addEventListener('mouseup',function(){isDown=false;});
  el.addEventListener('mousemove',function(e){
    if(!isDown)return; e.preventDefault();
    var x=e.pageX-el.offsetLeft;
    el.scrollLeft=scrollLeft-(x-startX);
  });
})();

loadAll();
})();
