<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piloti — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@300;400;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07070f; --bg-card:#0e0e1c; --bg-card2:#0b0b18;
    --border:#1e1e30; --border-hi:#2a2a42;
    --gold:#c9a227; --gold-hi:#e8c547; --gold-dim:rgba(201,162,39,0.10); --gold-glow:rgba(201,162,39,0.25);
    --orange:#ff5014; --text:#e8e0d0; --text-dim:#5a5470; --text-mid:#8a8098;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Barlow Condensed',sans-serif;
    min-height:100vh;
  }

  /* ── HERO ── */
  .hero{
    position:relative;
    background:linear-gradient(180deg,#0a0a1e 0%,#07070f 100%);
    border-bottom:1px solid var(--border-hi);
    padding:52px 24px 44px;
    text-align:center;
    overflow:hidden;
  }

  .hero::before{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(201,162,39,0.08) 0%,transparent 70%);
    pointer-events:none;
  }

  /* ember particles */
  .ember{position:absolute;border-radius:50%;pointer-events:none;animation:rise linear infinite;}
  @keyframes rise{
    0%  {transform:translateY(0) scale(1);opacity:.7;}
    100%{transform:translateY(-120px) scale(0);opacity:0;}
  }

  .hero-logo{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 0 14px var(--gold-glow));margin-bottom:18px;}
  .hero-eyebrow{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  .hero-title{font-family:'Russo One',sans-serif;font-size:clamp(28px,5vw,52px);color:var(--text);letter-spacing:4px;text-transform:uppercase;line-height:1;}
  .hero-title span{color:var(--gold);}
  .hero-sub{font-family:'Teko',sans-serif;font-size:16px;letter-spacing:4px;color:var(--text-dim);text-transform:uppercase;margin-top:10px;}

  .hero-stats{
    display:flex;
    gap:32px;
    justify-content:center;
    margin-top:28px;
    flex-wrap:wrap;
  }
  .hero-stat{text-align:center;}
  .hero-stat-num{font-family:'Russo One',sans-serif;font-size:32px;color:var(--gold);line-height:1;}
  .hero-stat-lbl{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}

  /* ── NAV ── */
  .nav-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 32px;
    border-bottom:1px solid var(--border);
    background:#080812;
    position:sticky;
    top:0;
    z-index:50;
    gap:16px;
    flex-wrap:wrap;
  }

  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-logo img{width:28px;height:28px;object-fit:contain;}
  .nav-logo span{font-family:'Russo One',sans-serif;font-size:13px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}

  .nav-links{display:flex;gap:6px;}
  .nav-link{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;text-decoration:none;padding:5px 12px;border-radius:5px;transition:color .2s,background .2s;}
  .nav-link:hover,.nav-link.active{color:var(--gold);background:var(--gold-dim);}

  .search-wrap{flex:1;max-width:280px;}
  .search-wrap input{width:100%;background:var(--bg-card);border:1px solid var(--border-hi);border-radius:7px;padding:7px 12px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
  .search-wrap input:focus{border-color:var(--gold);}

  /* ── MAIN ── */
  .container{max-width:1200px;margin:0 auto;padding:40px 24px 60px;}

  .section-header{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:28px;
  }
  .section-title{font-family:'Russo One',sans-serif;font-size:18px;color:var(--text);letter-spacing:3px;text-transform:uppercase;}
  .section-count{font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;color:var(--text-dim);}

  /* ── GRID ── */
  .pilots-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(480px,1fr));
    gap:16px;
  }

  /* ── CARD ── */
  .pilot-card{
    background:var(--bg-card);
    border:1px solid var(--border-hi);
    border-radius:14px;
    overflow:hidden;
    display:grid;
    grid-template-columns:160px 1fr;
    transition:border-color .3s,box-shadow .3s,transform .3s;
    animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    min-height:200px;
  }

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  .pilot-card:hover{
    border-color:var(--gold);
    box-shadow:0 8px 32px rgba(201,162,39,.14),0 0 0 1px rgba(201,162,39,.06);
    transform:translateY(-3px);
  }

  /* ── LEFT: PHOTO ── */
  .card-photo{
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,#0d0d20 0%,#1a1a30 100%);
  }

  .card-photo img{
    width:100%;height:100%;
    object-fit:cover;object-position:top center;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:block;
  }

  .pilot-card:hover .card-photo img{transform:scale(1.05);}

  .card-photo-placeholder{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:52px;color:var(--border-hi);
  }

  /* subtle right-edge fade into card body */
  .card-photo::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(to right,transparent 70%,var(--bg-card) 100%);
    pointer-events:none;
  }

  /* ── RIGHT: CONTENT ── */
  .card-body{
    padding:18px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:0;
    min-width:0;
  }

  .card-name{
    font-family:'Russo One',sans-serif;
    font-size:19px;color:var(--text);
    letter-spacing:2px;text-transform:uppercase;
    line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .card-psn{
    font-family:'Teko',sans-serif;font-size:13px;
    letter-spacing:2px;color:var(--gold);
    text-transform:uppercase;margin-top:3px;margin-bottom:10px;
  }

  .card-meta{display:flex;flex-direction:column;gap:3px;flex:1;}
  .meta-row{
    display:flex;align-items:baseline;gap:6px;
    font-size:13px;color:var(--text-mid);
    padding-bottom:3px;
    border-bottom:1px solid rgba(255,255,255,.025);
  }
  .meta-row:last-child{border-bottom:none;}
  .meta-icon{font-size:13px;flex-shrink:0;width:18px;text-align:center;}
  .meta-label{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;min-width:46px;}
  .meta-value{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .card-bio{
    margin-top:8px;
    font-size:12px;color:var(--text-dim);
    line-height:1.5;font-style:italic;
    border-top:1px solid var(--border);
    padding-top:8px;
  }

  .card-badges{
    margin-top:10px;
    display:flex;flex-wrap:wrap;gap:4px;
  }

  .badge{
    background:var(--gold-dim);
    border:1px solid rgba(201,162,39,.2);
    border-radius:20px;
    padding:2px 9px;
    font-family:'Teko',sans-serif;
    font-size:11px;letter-spacing:1px;
    color:var(--gold);text-transform:uppercase;
  }

  .tracks-pair{
    display:flex;flex-wrap:wrap;gap:4px;
    margin-top:6px;
  }
  .track-chip{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.02);
    border:1px solid var(--border);
    border-radius:6px;padding:3px 8px;
    font-size:11px;color:var(--text-mid);
    white-space:nowrap;
  }
  .track-chip.love{border-color:rgba(255,100,100,.18);color:#e88;}
  .track-chip.hate{border-color:rgba(100,100,255,.15);color:#aaf;}

  /* ── EMPTY ── */
  .empty{text-align:center;padding:80px 20px;color:var(--text-dim);}
  .empty .ei{font-size:52px;margin-bottom:16px;}
  .empty p{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:4px;text-transform:uppercase;}

  /* ── FOOTER ── */
  .footer{
    border-top:1px solid var(--border);
    padding:28px 24px;
    text-align:center;
    font-family:'Teko',sans-serif;
    font-size:13px;letter-spacing:2px;color:var(--text-dim);
    text-transform:uppercase;
  }
  .footer a{color:var(--gold);text-decoration:none;}
  .footer a:hover{color:var(--gold-hi);}

  @media(max-width:640px){
    .pilots-grid{grid-template-columns:1fr;}
    .pilot-card{grid-template-columns:120px 1fr;}
    .nav-strip{padding:10px 16px;}
    .search-wrap{max-width:100%;width:100%;}
  }
</style>
</head>
<body>

<!-- STICKY NAV -->
<nav class="nav-strip">
  <a class="nav-logo" href="index.html">
    <img src="etna-logo.jpg" alt="ERC">
    <span>Etna Racing Club</span>
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Home</a>
    <a class="nav-link" href="calendario.html">Calendario</a>
    <a class="nav-link active" href="piloti.html">Piloti</a>
  </div>
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Cerca pilota..." oninput="filterPilots()">
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <img class="hero-logo" src="etna-logo.jpg" alt="Etna Racing Club">
  <div class="hero-eyebrow">Etna Racing Club</div>
  <h1 class="hero-title">I Nostri <span>Piloti</span></h1>
  <div class="hero-sub">Il roster ufficiale del club</div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="hero-stat-num" id="statCount">—</div>
      <div class="hero-stat-lbl">Piloti Attivi</div>
    </div>
    <div class="hero-stat">
      <div class="hero-stat-num" id="statNazioni">—</div>
      <div class="hero-stat-lbl">Nazioni</div>
    </div>
  </div>
</section>

<!-- MAIN -->
<div class="container">
  <div class="section-header">
    <div class="section-title">Roster</div>
    <div class="section-count" id="countLabel"></div>
  </div>
  <div class="pilots-grid" id="pilotsGrid">
    <div class="empty"><div class="ei">⏳</div><p>Caricamento roster...</p></div>
  </div>
</div>

<footer class="footer">
  © 2026 Etna Racing Club &nbsp;·&nbsp; <a href="index.html">Home</a> &nbsp;·&nbsp; <a href="calendario.html">Calendario</a>
</footer>

<script>
const REPO   = 'mz4466';
const RNAME  = 'etna-racing-club';
const FOLDER = 'piloti_schede';

let allPilots = [];

async function loadPilots(){
  try {
    // List folder via GitHub API (no auth needed for public repo)
    const r = await fetch(`https://api.github.com/repos/${REPO}/${RNAME}/contents/${FOLDER}?ref=main`);
    if(!r.ok) throw new Error();
    const files = await r.json();
    const jsonFiles = files.filter(f=>f.name.endsWith('.json') && f.name !== 'index.json');

    if(!jsonFiles.length){ renderGrid([]); return; }

    const pilots = await Promise.all(jsonFiles.map(async f=>{
      try {
        // Use GitHub API contents endpoint (works on both public and private repos)
        // f.download_url may be blocked; use f.url (API) or decode content directly
        const jr = await fetch(f.url);
        if(!jr.ok) return null;
        const fd = await jr.json();
        // GitHub API returns base64-encoded content
        if(fd.content) {
          return JSON.parse(decodeURIComponent(escape(atob(fd.content.replace(/\s/g,'')))));
        }
        return null;
      } catch { return null; }
    }));

    allPilots = pilots.filter(p => p && (p.nome || p.psn));
    updateStats();
    renderGrid(allPilots);
  } catch {
    document.getElementById('pilotsGrid').innerHTML=`<div class="empty"><div class="ei">📭</div><p>Roster non disponibile</p></div>`;
  }
}

function updateStats(){
  document.getElementById('statCount').textContent = allPilots.length;
  const nazioni = new Set(allPilots.map(p=>p.nazione).filter(Boolean));
  document.getElementById('statNazioni').textContent = nazioni.size || '—';
  document.getElementById('countLabel').textContent = `${allPilots.length} piloti registrati`;
}

function renderGrid(pilots){
  const grid = document.getElementById('pilotsGrid');
  if(!pilots.length){
    grid.innerHTML=`<div class="empty"><div class="ei">🏎️</div><p>Nessun pilota registrato</p></div>`;
    return;
  }
  grid.innerHTML='';
  pilots.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className='pilot-card';
    card.style.animationDelay=`${i*0.07}s`;

    // Support both base64 (p.foto from new admin) and filename (p.photo from old format)
    var photoSrc = p.foto || (p.photo ? 'piloti_schede/' + p.photo : null);
    const photoHTML = photoSrc
      ? `<img src="${esc(photoSrc)}" alt="${esc(p.nome)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholderStyle = photoSrc ? 'display:none':'';

    const badgesHTML = (p.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('');

    card.innerHTML=`
      <div class="card-photo">
        ${photoHTML}
        <div class="card-photo-placeholder" style="${placeholderStyle}">🪖</div>
      </div>

      <div class="card-body">
        <div class="card-name">${esc(p.nome||'—')}</div>
        <div class="card-psn">🎮 ${esc(p.psn||p.gt7Name||'—')}</div>
        <div class="card-meta">
          ${(p.nazione||p.country)?`<div class="meta-row"><span class="meta-icon">🌍</span><span class="meta-label">Nazione</span><span class="meta-value">${esc(p.nazione||p.country)}</span></div>`:''}
          ${(p.auto||p.car)?`<div class="meta-row"><span class="meta-icon">🚗</span><span class="meta-label">Auto</span><span class="meta-value">${esc(p.auto||p.car)}</span></div>`:''}
          ${p.stile?`<div class="meta-row"><span class="meta-icon">🎯</span><span class="meta-label">Stile</span><span class="meta-value">${esc(p.stile)}</span></div>`:''}
        </div>
        ${(p.pistaAma||p.pistaOdia)?`
        <div class="tracks-pair">
          ${p.pistaAma?`<div class="track-chip love">❤️ ${esc(p.pistaAma)}</div>`:''}
          ${p.pistaOdia?`<div class="track-chip hate">💀 ${esc(p.pistaOdia)}</div>`:''}
        </div>`:''}
        ${badgesHTML?`<div class="card-badges">${badgesHTML}</div>`:''}
        ${p.bio?`<div class="card-bio">"${esc(p.bio)}"</div>`:''}
      </div>
    `;
    grid.appendChild(card);
  });

  // spawn embers
  spawnEmbers();
}

function filterPilots(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(!q){ renderGrid(allPilots); return; }
  renderGrid(allPilots.filter(p=>[p.nome,p.psn,p.auto,p.nazione,p.stile].some(v=>v&&v.toLowerCase().includes(q))));
}

function spawnEmbers(){
  const hero = document.getElementById('hero');
  hero.querySelectorAll('.ember').forEach(e=>e.remove());
  for(let i=0;i<12;i++){
    const e=document.createElement('div');
    e.className='ember';
    const size=Math.random()*3+1;
    e.style.cssText=`
      width:${size}px;height:${size}px;
      background:${Math.random()>.5?'var(--gold)':'var(--orange)'};
      left:${Math.random()*100}%;
      bottom:${Math.random()*30}%;
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*4}s;
      opacity:${.3+Math.random()*.5};
    `;
    hero.appendChild(e);
  }
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

loadPilots();
</script>
</body>
</html>
