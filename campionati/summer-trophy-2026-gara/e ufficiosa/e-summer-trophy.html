<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Trophy 2026 — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@300;400;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07070f;--bg-card:#0e0e1c;--border:#1e1e30;--border-hi:#2a2a42;
    --gold:#c9a227;--gold-hi:#e8c547;--gold-dim:rgba(201,162,39,0.10);
    --text:#e8e0d0;--text-dim:#5a5470;--text-mid:#8a8098;
    --red:#c0392b;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;}

  .champ-header{
    background:linear-gradient(180deg,rgba(10,10,24,0.98) 0%,var(--bg) 100%);
    border-bottom:2px solid var(--gold);
    padding:36px 24px 28px;
    text-align:center;
  }

  .champ-logo{width:64px;height:64px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 12px rgba(201,162,39,0.3));}

  .champ-season{
    font-family:'Teko',sans-serif;font-size:13px;letter-spacing:5px;
    color:var(--gold);text-transform:uppercase;margin-bottom:6px;
  }
  .champ-name{
    font-family:'Russo One',sans-serif;font-size:32px;
    color:var(--text);letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;
  }
  .champ-sub{
    font-family:'Teko',sans-serif;font-size:16px;letter-spacing:3px;
    color:var(--text-dim);text-transform:uppercase;
  }
  .champ-desc{
    max-width:560px;margin:12px auto 0;font-size:16px;color:var(--text-mid);
    letter-spacing:0.5px;line-height:1.5;
  }

  .cat-badge{
    display:inline-block;margin-top:14px;
    background:var(--gold-dim);border:1px solid rgba(201,162,39,0.3);
    border-radius:20px;padding:4px 18px;
    font-family:'Teko',sans-serif;font-size:14px;letter-spacing:3px;
    color:var(--gold);text-transform:uppercase;
  }

  .wrap{max-width:820px;margin:0 auto;padding:32px 20px;}

  .section-title{
    font-family:'Teko',sans-serif;font-size:13px;letter-spacing:4px;
    color:var(--text-dim);text-transform:uppercase;
    margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border);
  }

  .round-card{
    background:var(--bg-card);border:1px solid var(--border-hi);
    border-radius:10px;padding:18px 20px;margin-bottom:12px;
    transition:border-color 0.2s,box-shadow 0.2s;
  }
  .round-card:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(201,162,39,0.08);}

  .round-header{display:flex;align-items:center;gap:16px;margin-bottom:12px;}

  .round-num{
    font-family:'Russo One',sans-serif;font-size:13px;color:#000;
    background:var(--gold);border-radius:6px;padding:4px 12px;flex-shrink:0;
  }

  .round-circuit{
    font-family:'Russo One',sans-serif;font-size:18px;
    color:var(--text);letter-spacing:1px;text-transform:uppercase;
  }

  .round-date{
    font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;
    color:var(--text-dim);text-transform:uppercase;margin-top:2px;
  }

  .round-info{flex:1;}

  .results-btn{
    font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;
    text-transform:uppercase;padding:7px 16px;border-radius:6px;
    text-decoration:none;border:1px solid var(--gold);color:var(--gold);
    flex-shrink:0;transition:background 0.2s;
  }
  .results-btn:hover{background:var(--gold-dim);}
  .results-btn.upcoming{border-color:var(--border-hi);color:var(--text-dim);pointer-events:none;}

  .round-details{display:flex;flex-wrap:wrap;gap:8px;}

  .detail-pill{
    background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:20px;padding:4px 12px;
    font-family:'Teko',sans-serif;font-size:14px;letter-spacing:1px;
    color:var(--text-mid);
  }

  .round-note{
    margin-top:10px;font-size:14px;color:var(--text-dim);
    letter-spacing:0.5px;font-style:italic;
  }

  .back-link{
    display:block;text-align:center;margin-top:28px;
    font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;
    color:var(--text-dim);text-decoration:none;text-transform:uppercase;
    transition:color 0.2s;
  }
  .back-link:hover{color:var(--text);}

  .round-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;}
  .round-row .round-card{flex:1;margin-bottom:0;}
  .round-manifesto{width:120px;flex-shrink:0;border-radius:10px;overflow:hidden;border:1px solid var(--border-hi);cursor:pointer;transition:border-color 0.2s,box-shadow 0.2s;}
  .round-manifesto:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(201,162,39,0.15);}
  .round-manifesto img{width:100%;height:100%;object-fit:cover;display:block;}

  .manifesto-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out;}
  .manifesto-lightbox.open{display:flex;}
  .manifesto-lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,0.8);}
  .manifesto-lightbox-close{position:absolute;top:20px;right:24px;font-size:28px;color:#fff;cursor:pointer;line-height:1;opacity:0.7;}
  .manifesto-lightbox-close:hover{opacity:1;}
</style>
</head>
