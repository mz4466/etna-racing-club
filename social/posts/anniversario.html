<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anniversario — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--card:#0e0e1c;--gold:#c9a227;--gold-hi:#e8c547;--text:#e8e0d0;--muted:#c9b8a3;--dim:#5a5470}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Barlow Condensed",sans-serif;min-height:100vh}
.top{background:#050510;border-bottom:1px solid rgba(201,184,163,0.1);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:"Teko",sans-serif;font-size:16px;letter-spacing:2px;color:var(--gold-hi);text-decoration:none}
.back{font-family:"Teko",sans-serif;font-size:12px;letter-spacing:2px;color:var(--gold);text-decoration:none;border:1px solid rgba(201,162,39,0.25);padding:5px 14px;border-radius:6px;text-transform:uppercase}
.back:hover{background:rgba(201,162,39,0.1)}
.hdr{max-width:1000px;margin:28px auto 0;padding:0 20px}
.hdr h1{font-family:"Russo One",sans-serif;font-size:clamp(22px,4vw,36px);color:var(--gold);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 20px rgba(201,162,39,0.3)}
.hdr .meta{font-family:"Teko",sans-serif;font-size:13px;letter-spacing:2px;color:var(--dim);margin-top:6px;text-transform:uppercase;display:flex;gap:16px}
.cv-wrap{max-width:1000px;margin:24px auto 60px;padding:0 20px}
.cv{position:relative;width:100%;height:0;padding-bottom:58.13%}
.cb{position:absolute;border-radius:8px;overflow:auto}
.cb-t{font-family:"Russo One",sans-serif;color:var(--gold-hi);letter-spacing:1px;padding:4px 8px;text-shadow:0 0 12px rgba(201,162,39,0.2)}
.cb-t.s{font-size:14px}.cb-t.m{font-size:18px}.cb-t.l{font-size:24px}
.cb-p{background:var(--card);border:1px solid rgba(52,152,219,0.2)}
.cb-p img{width:100%;height:100%;object-fit:contain;display:block}
.cb-v{background:var(--card);border:1px solid rgba(231,76,60,0.2)}
.cb-v iframe,.cb-v video{width:100%;height:100%;border:none}
.cb-x{background:rgba(39,174,96,0.04);border:1px solid rgba(39,174,96,0.12);border-radius:8px;padding:6px 8px;color:var(--muted);font-size:13px;line-height:1.6;overflow:auto}
.cb-a{background:rgba(155,89,182,0.05);border:1px solid rgba(155,89,182,0.15);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:8px}
.cb-a span{font-family:"Teko",sans-serif;font-size:13px;letter-spacing:1px;color:#9b59b6}
.cb-a audio{width:100%}
.cb-n{background:rgba(255,140,66,0.04);border:1px solid rgba(255,140,66,0.12);border-radius:8px;padding:6px 8px;color:#ff8c42;font-style:italic;font-size:12px;line-height:1.5;overflow:auto}
.cb-e{background:var(--card);border:1px solid rgba(26,188,156,0.15);border-radius:8px;overflow:hidden}
.cb-e iframe{width:100%;height:100%;border:none}
@media(max-width:768px){.cv{height:auto!important;padding-bottom:0!important}
.cb{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;margin-bottom:12px}
.cb-p img{height:auto;max-height:400px;object-fit:contain}
.cb-v{padding-bottom:56.25%;position:relative;height:0!important}.cb-v iframe,.cb-v video{position:absolute;top:0;left:0}}
</style>
</head>
<body>
<div class="top"><a href="../../social.html" class="logo">◀ ERC Social</a><a href="../../social.html" class="back">← Tutti i Post</a></div>
<div class="hdr"><h1>Anniversario</h1><div class="meta"><span>27 maggio 2026</span></div></div>
<div class="cv-wrap"><div class="cv">
<div class="cb" style="left:13.6%;top:3.65%;width:43.53%;height:12.62%"><div class="cb-t l">Primo Anniversario - Etna Racing Club</div></div>
<div class="cb cb-p" style="left:13.27%;top:17.79%;width:43.92%;height:77.88%"><img src="../media/anniversario-b1.jpeg" alt="" loading="lazy"></div>
</div></div>
</body>
</html>
