<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestisci Social — ERC Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07070f;--card:#0e0e1c;--input:#13131f;
      --border:rgba(201,184,163,0.1);--border-hi:rgba(201,184,163,0.2);
      --gold:#c9a227;--gold-hi:#e8c547;--gold-dim:rgba(201,162,39,0.10);
      --red:#ff5014;--orange:#ff8c42;--cream:#fff5e6;--muted:#c9b8a3;
      --green:#27ae60;--del:#c0392b;--text:#fff5e6;--dim:#5a5470;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Barlow Condensed',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}
    .topbar{background:#050510;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .topbar-brand{display:flex;align-items:center;gap:10px;font-family:'Teko',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold-hi)}
    .topbar-brand img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(201,162,39,0.4))}
    .topbar-right{display:flex;align-items:center;gap:8px}
    .layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 49px)}
    .sidebar{background:#0a0a16;border-right:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
    .sb-title{font-family:'Teko',sans-serif;font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:2px}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;border:none;cursor:pointer;font-family:'Teko',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;transition:all .15s}
    .btn-gold{background:var(--gold);color:#000}.btn-gold:hover{background:var(--gold-hi)}
    .btn-out{background:transparent;border:1px solid var(--border-hi);color:var(--muted)}.btn-out:hover{border-color:var(--gold);color:var(--gold)}
    .btn-red{background:var(--del);color:#fff}.btn-red:hover{background:#e74c3c}
    .btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#2ecc71}
    .btn-sm{padding:4px 9px;font-size:11px}
    .auth-box{background:var(--card);border:1px solid var(--border-hi);border-radius:8px;padding:10px}
    .auth-box label{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
    .auth-box input{width:100%;background:var(--input);border:1px solid var(--border-hi);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:13px;outline:none}
    .auth-box input:focus{border-color:var(--gold)}
    #connStatus{font-size:11px;margin-top:5px;color:var(--dim)}
    .sb-item{background:var(--card);border:1px solid var(--border-hi);border-radius:6px;padding:7px 10px;cursor:pointer;transition:border-color .15s;margin-bottom:3px;position:relative}
    .sb-item:hover{border-color:var(--gold)}
    .sb-item.active{border-color:var(--gold);background:var(--gold-dim)}
    .sb-item-title{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:0.5px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
    .sb-item-sub{font-size:10px;color:var(--dim);margin-top:1px}
    .sb-item-del{position:absolute;top:6px;right:6px;background:none;border:none;color:rgba(192,57,43,.4);cursor:pointer;font-size:12px;padding:0;line-height:1}
    .sb-item-del:hover{color:var(--del)}
    .main-area{display:flex;flex-direction:column;height:100%;overflow:hidden}
    .toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .tb-btn{background:var(--gold-dim);border:1px solid rgba(201,162,39,0.25);border-radius:6px;padding:5px 11px;font-family:'Teko',sans-serif;font-size:11px;letter-spacing:1.5px;color:var(--gold);cursor:pointer;text-transform:uppercase;transition:all .15s;display:flex;align-items:center;gap:4px}
    .tb-btn:hover{background:rgba(201,162,39,0.18);border-color:var(--gold)}
    .tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
    .tb-right{margin-left:auto;display:flex;gap:6px;align-items:center}
    .tb-pub{background:var(--gold);color:#000;border:none;border-radius:6px;padding:6px 14px;font-family:'Teko',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-weight:600}
    .tb-pub:hover{background:var(--gold-hi)}
    .canvas-wrap{flex:1;display:flex;overflow:hidden}
    .canvas{flex:1;position:relative;overflow:hidden;background:
      repeating-linear-gradient(0deg,transparent,transparent 29px,rgba(201,184,163,0.025) 29px,rgba(201,184,163,0.025) 30px),
      repeating-linear-gradient(90deg,transparent,transparent 29px,rgba(201,184,163,0.025) 29px,rgba(201,184,163,0.025) 30px)}
    .block{position:absolute;border:1.5px solid rgba(201,184,163,0.18);border-radius:7px;background:var(--card);cursor:grab;user-select:none;min-width:80px;min-height:40px;transition:box-shadow .15s}
    .block:hover{border-color:rgba(201,162,39,0.4)}
    .block.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 16px rgba(201,162,39,0.15)}
    .block.dragging{z-index:200;cursor:grabbing;box-shadow:0 6px 24px rgba(0,0,0,0.5);border-color:var(--gold-hi)}
    .block-hdr{display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid rgba(201,184,163,0.06);font-family:'Teko',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
    .block-body{padding:6px 8px;overflow:auto;height:calc(100% - 28px)}
    .block-del{position:absolute;top:3px;right:5px;background:none;border:none;color:rgba(192,57,43,.4);cursor:pointer;font-size:11px;display:none;z-index:10;padding:0}
    .block.selected .block-del,.block:hover .block-del{display:block}
    .block-del:hover{color:var(--del)}
    .block-resize{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;opacity:0}
    .block.selected .block-resize{opacity:1}
    .btype-title .block-hdr{color:var(--gold-hi)}
    .btype-photo .block-hdr{color:#3498db}
    .btype-video .block-hdr{color:#e74c3c}
    .btype-text .block-hdr{color:#27ae60}
    .btype-audio .block-hdr{color:#9b59b6}
    .btype-notes .block-hdr{color:var(--orange)}
    .btype-embed .block-hdr{color:#1abc9c}
    .bc-title{font-family:'Russo One',sans-serif;font-size:18px;color:var(--gold-hi);letter-spacing:1px;padding:4px;outline:none;min-height:28px}
    .bc-photo{display:flex;align-items:center;justify-content:center;min-height:60px;color:#3498db;font-size:10px;letter-spacing:1px;cursor:pointer}
    .bc-photo img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;display:block}
    .bc-video{display:flex;align-items:center;justify-content:center;min-height:60px;background:rgba(231,76,60,0.05);border-radius:4px;color:#e74c3c;font-size:24px;cursor:pointer}
    .bc-text{font-size:13px;color:var(--muted);line-height:1.6;outline:none;min-height:40px}
    .bc-audio{display:flex;align-items:center;gap:8px;color:#9b59b6;font-size:12px}
    .bc-notes{font-size:12px;color:var(--orange);font-style:italic;line-height:1.5;outline:none;min-height:30px}
    .bc-embed{font-size:11px;color:#1abc9c;min-height:40px}
    .edit-panel{width:260px;background:#0a0a16;border-left:1px solid var(--border);padding:14px;overflow-y:auto;display:none;flex-shrink:0}
    .edit-panel.open{display:block}
    .ep-title{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
    .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .field label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
    .field input,.field select,.field textarea{background:var(--input);border:1px solid var(--border-hi);border-radius:6px;padding:7px 10px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:13px;outline:none;width:100%}
    .field input:focus,.field textarea:focus{border-color:var(--gold)}
    .field textarea{resize:vertical;min-height:60px}
    .upload-zone{border:2px dashed rgba(201,162,39,0.2);border-radius:7px;padding:14px;text-align:center;cursor:pointer;transition:border-color .2s}
    .upload-zone:hover{border-color:var(--gold)}
    .upload-zone input{display:none}
    .upload-hint{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
    .new-post-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,5,16,0.85);z-index:300;display:none;align-items:center;justify-content:center}
    .new-post-overlay.open{display:flex}
    .new-post-form{background:var(--card);border:1px solid var(--border-hi);border-radius:12px;padding:24px;width:380px;max-width:90%}
    .new-post-form h3{font-family:'Teko',sans-serif;font-size:16px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
    .hint{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
    .hint-icon{font-size:40px;margin-bottom:12px}
    #toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:8px 16px;font-family:'Teko',sans-serif;font-size:13px;letter-spacing:1px;color:var(--text);z-index:999;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
    #toast.show{opacity:1;transform:translateY(0)}
    #toast.ok{border-color:var(--green);color:#2ecc71}
    #toast.err{border-color:var(--del);color:#e74c3c}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <img src="etna-logo.jpg" alt="ERC" onerror="this.style.display='none'">
    <span>Gestisci Social</span>
  </div>
  <div class="topbar-right">
    <a href="social.html" class="btn btn-out btn-sm" target="_blank">&#128065; Visualizza</a>
    <a href="admin.html" class="btn btn-out btn-sm">&larr; Admin</a>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div>
      <div class="sb-title">GitHub</div>
      <div class="auth-box">
        <label>PAT Token</label>
        <input type="password" id="patInput" placeholder="ghp_xxxx" autocomplete="off">
        <div style="margin-top:6px;display:flex;gap:5px">
          <button class="btn btn-gold" style="flex:1" onclick="connect()">Connetti</button>
          <button class="btn btn-out" onclick="reloadIndex()">&#8634;</button>
        </div>
        <div id="connStatus">Non connesso</div>
      </div>
    </div>
    <div>
      <div class="sb-title">Post</div>
      <button class="btn btn-out" style="width:100%;justify-content:center;margin-bottom:6px" onclick="showNewPostForm()">&#65291; Nuovo Post</button>
      <div id="postList"></div>
    </div>
  </div>

  <div class="main-area" id="mainArea">
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="tb-btn" onclick="addBlock('title')">&#9733; Titolo</div>
      <div class="tb-btn" onclick="addBlock('photo')">&#128247; Foto</div>
      <div class="tb-btn" onclick="addBlock('video')">&#127909; Video</div>
      <div class="tb-btn" onclick="addBlock('text')">&#128221; Testo</div>
      <div class="tb-btn" onclick="addBlock('audio')">&#127925; Audio</div>
      <div class="tb-btn" onclick="addBlock('notes')">&#128204; Note</div>
      <div class="tb-sep"></div>
      <div class="tb-btn" onclick="addBlock('embed')">&#128279; Embed</div>
      <div class="tb-right">
        <button class="btn btn-out btn-sm" onclick="savePostData()">&#128190; Salva Bozza</button>
        <button class="tb-pub" onclick="publishPost()">&#8593; Pubblica</button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap" style="display:none">
      <div class="canvas" id="canvas"></div>
      <div class="edit-panel" id="editPanel">
        <div class="ep-title" id="epTitle">Proprietà</div>
        <div id="epFields"></div>
      </div>
    </div>
    <div class="hint" id="hintArea">
      <span class="hint-icon">&#128225;</span>
      Connetti GitHub e seleziona o crea un post
    </div>
  </div>
</div>

<div class="new-post-overlay" id="newPostOverlay">
  <div class="new-post-form">
    <h3>Nuovo Post</h3>
    <div class="field"><label>Titolo</label><input type="text" id="npTitle" placeholder="es. Race Day Recap — Dragon Trail"></div>
    <div class="field"><label>Data</label><input type="date" id="npDate"></div>
    <div class="field"><label>Campionato (opzionale)</label><select id="npChamp"><option value="">— Nessuno —</option></select></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-out" onclick="hideNewPostForm()">Annulla</button>
      <button class="btn btn-gold" onclick="createPost()">Crea Post</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var OWNER='mz4466',REPO='etna-racing-club',BRANCH='main';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO;
var token='';
var socialIndex=[];
var currentPost=null;
var blocks=[];
var blockIdCounter=0;
var selectedBlock=null;

function ghHeaders(){return{Authorization:'token '+token,Accept:'application/vnd.github.v3+json'};}
async function ghGet(path){
  var r=await fetch(API+'/contents/'+path+'?ref='+BRANCH+'&_='+Date.now(),{headers:ghHeaders()});
  if(!r.ok) throw new Error((await r.json()).message||r.status);
  return await r.json();
}
async function ghPut(path,content,message){
  var b64=btoa(unescape(encodeURIComponent(content)));
  for(var attempt=0;attempt<2;attempt++){
    var sha=null;
    try{var ex=await ghGet(path);sha=ex.sha;}catch(e){}
    var body={message:message,content:b64,branch:BRANCH};
    if(sha) body.sha=sha;
    var r=await fetch(API+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
    if(r.ok) return;
    var err=await r.json();
    if(attempt===0&&err.message&&err.message.indexOf('does not match')!==-1) continue;
    throw new Error(err.message||r.status);
  }
}
async function ghPutBinary(path,b64,message){
  for(var attempt=0;attempt<2;attempt++){
    var sha=null;
    try{var ex=await ghGet(path);sha=ex.sha;}catch(e){}
    var body={message:message,content:b64,branch:BRANCH};
    if(sha) body.sha=sha;
    var r=await fetch(API+'/contents/'+path,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
    if(r.ok) return;
    var err=await r.json();
    if(attempt===0&&err.message&&err.message.indexOf('does not match')!==-1) continue;
    throw new Error(err.message||r.status);
  }
}
async function ghDelete(path,message){
  var ex=await ghGet(path);
  var r=await fetch(API+'/contents/'+path,{method:'DELETE',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify({message:message,sha:ex.sha,branch:BRANCH})});
  if(!r.ok) throw new Error((await r.json()).message||r.status);
}
async function ghReadJson(path){
  var meta=await ghGet(path);
  return JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\s/g,'')))));
}

function getToken(){return document.getElementById('patInput').value.trim();}

async function connect(){
  token=getToken();
  if(!token){toast('Inserisci il PAT Token','err');return;}
  try{
    var r=await fetch(API,{headers:ghHeaders()});
    if(!r.ok) throw new Error('Auth failed');
    document.getElementById('connStatus').textContent='\u2713 Connesso';
    document.getElementById('connStatus').style.color='var(--green)';
    await loadIndex();
    await loadCalendario();
  }catch(e){
    document.getElementById('connStatus').textContent='Errore: '+e.message;
    document.getElementById('connStatus').style.color='var(--del)';
  }
}
async function reloadIndex(){token=getToken();if(token)await loadIndex();}

async function loadIndex(){
  try{socialIndex=await ghReadJson('social/index.json');}catch(e){socialIndex=[];}
  if(!Array.isArray(socialIndex)) socialIndex=[];
  socialIndex.sort(function(a,b){return(b.date||'').localeCompare(a.date||'');});
  renderPostList();
}
async function saveIndex(){
  await ghPut('social/index.json',JSON.stringify(socialIndex,null,2),'Update social index');
}
async function loadCalendario(){
  try{
    var cal=await ghReadJson('calendario.json');
    var sel=document.getElementById('npChamp');
    sel.innerHTML='<option value="">— Nessuno —</option>';
    cal.forEach(function(c){
      var opt=document.createElement('option');
      opt.value=c.name+' ('+c.year+')';
      opt.textContent=c.name+' — '+c.year;
      sel.appendChild(opt);
    });
  }catch(e){}
}

function renderPostList(){
  var list=document.getElementById('postList');
  if(!socialIndex.length){
    list.innerHTML='<div style="text-align:center;padding:10px;font-size:11px;color:var(--dim)">Nessun post</div>';
    return;
  }
  var html='';
  socialIndex.forEach(function(p,i){
    var cls='sb-item'+(currentPost&&currentPost.slug===p.slug?' active':'');
    html+='<div class="'+cls+'" onclick="selectPost('+i+')">';
    html+='<button class="sb-item-del" onclick="event.stopPropagation();deletePost('+i+')">\u2715</button>';
    html+='<div class="sb-item-title">'+esc(p.title)+'</div>';
    html+='<div class="sb-item-sub">'+esc(p.date||'')+' \u00b7 '+esc(p.campionato||'')+'</div>';
    html+='</div>';
  });
  list.innerHTML=html;
}

function showNewPostForm(){
  var today=new Date();
  var y=today.getFullYear(),m=today.getMonth()+1,d=today.getDate();
  document.getElementById('npDate').value=y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d;
  document.getElementById('npTitle').value='';
  document.getElementById('npChamp').value='';
  document.getElementById('newPostOverlay').classList.add('open');
  document.getElementById('npTitle').focus();
}
function hideNewPostForm(){document.getElementById('newPostOverlay').classList.remove('open');}

async function createPost(){
  var title=document.getElementById('npTitle').value.trim();
  var date=document.getElementById('npDate').value;
  var champ=document.getElementById('npChamp').value;
  if(!title){toast('Inserisci un titolo','err');return;}
  var slug=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(socialIndex.some(function(p){return p.slug===slug;})) slug+='-'+Date.now();
  var year=date?parseInt(date.split('-')[0],10):new Date().getFullYear();
  var post={title:title,slug:slug,date:date,year:year,campionato:champ,blockTypes:[],created:new Date().toISOString()};
  socialIndex.unshift(post);
  await saveIndex();
  hideNewPostForm();
  currentPost=post;
  blocks=[];blockIdCounter=0;selectedBlock=null;
  renderPostList();
  showCanvas();
  toast('Post creato \u2713','ok');
}

async function deletePost(idx){
  if(!confirm('Eliminare questo post?')) return;
  var p=socialIndex[idx];
  try{await ghDelete('social/posts/'+p.slug+'.json','Delete post data');}catch(e){}
  try{await ghDelete('social/posts/'+p.slug+'.html','Delete post html');}catch(e){}
  socialIndex.splice(idx,1);
  await saveIndex();
  if(currentPost&&currentPost.slug===p.slug){currentPost=null;blocks=[];selectedBlock=null;hideCanvas();}
  renderPostList();
  toast('Post eliminato','ok');
}

async function selectPost(idx){
  currentPost=socialIndex[idx];
  renderPostList();
  try{
    var data=await ghReadJson('social/posts/'+currentPost.slug+'.json');
    blocks=data.blocks||[];
    blockIdCounter=blocks.length?Math.max.apply(null,blocks.map(function(b){return parseInt(b.id.replace('b',''),10)||0;}))+1:0;
  }catch(e){blocks=[];blockIdCounter=0;}
  selectedBlock=null;
  showCanvas();
  renderBlocks();
  closeEditPanel();
}

function showCanvas(){
  document.getElementById('toolbar').style.display='';
  document.getElementById('canvasWrap').style.display='';
  document.getElementById('hintArea').style.display='none';
}
function hideCanvas(){
  document.getElementById('toolbar').style.display='none';
  document.getElementById('canvasWrap').style.display='none';
  document.getElementById('hintArea').style.display='';
}

function addBlock(type){
  if(!currentPost) return;
  var id='b'+blockIdCounter++;
  var w=type==='title'?40:type==='photo'||type==='video'?25:22;
  var h=type==='title'?8:type==='photo'||type==='video'?28:15;
  var content={};
  if(type==='title') content={text:'Nuovo Titolo',size:'medium'};
  else if(type==='photo') content={src:'',caption:'',pending:null};
  else if(type==='video') content={url:'',caption:''};
  else if(type==='text') content={html:'Scrivi qui...'};
  else if(type==='audio') content={src:'',label:'Audio',pending:null};
  else if(type==='notes') content={text:'Aggiungi nota...'};
  else if(type==='embed') content={url:''};
  blocks.push({id:id,type:type,x:10+Math.random()*20,y:10+Math.random()*20,w:w,h:h,content:content});
  renderBlocks();
  selectBlockById(id);
}

function renderBlocks(){
  var cv=document.getElementById('canvas');
  cv.innerHTML='';
  blocks.forEach(function(b){cv.appendChild(createBlockEl(b));});
}

function createBlockEl(b){
  var el=document.createElement('div');
  el.className='block btype-'+b.type;
  el.id='blk-'+b.id;
  el.dataset.bid=b.id;
  el.style.left=b.x+'%';el.style.top=b.y+'%';el.style.width=b.w+'%';
  if(b.h) el.style.height=b.h+'%';
  if(selectedBlock&&selectedBlock.id===b.id) el.classList.add('selected');

  var labels={title:'\u2733 Titolo',photo:'\uD83D\uDCF7 Foto',video:'\uD83C\uDFA5 Video',text:'\uD83D\uDCDD Testo',audio:'\uD83C\uDFB5 Audio',notes:'\uD83D\uDCCC Note',embed:'\uD83D\uDD17 Embed'};
  var hdr=document.createElement('div');
  hdr.className='block-hdr';
  hdr.textContent=labels[b.type]||b.type;
  el.appendChild(hdr);

  var body=document.createElement('div');
  body.className='block-body';
  renderBlockContent(body,b);
  el.appendChild(body);

  var del=document.createElement('button');
  del.className='block-del';del.textContent='\u2715';
  del.onclick=function(e){e.stopPropagation();removeBlock(b.id);};
  el.appendChild(del);

  var rsz=document.createElement('div');
  rsz.className='block-resize';
  rsz.onmousedown=function(e){startResize(e,b);};
  el.appendChild(rsz);

  el.onmousedown=function(e){
    if(e.target===del||e.target===rsz) return;
    startDrag(e,b,el);
  };
  el.ondblclick=function(e){
    if(e.target===del) return;
    selectBlockById(b.id);
    openInlineEdit(b);
  };
  return el;
}

function renderBlockContent(body,b){
  var c=b.content||{};
  if(b.type==='title'){
    body.innerHTML='<div class="bc-title">'+esc(c.text||'')+'</div>';
  }else if(b.type==='photo'){
    if(c.src) body.innerHTML='<div class="bc-photo"><img src="'+escAttr(c.src)+'" alt=""></div>';
    else body.innerHTML='<div class="bc-photo">\uD83D\uDCC1 Doppio click per caricare</div>';
  }else if(b.type==='video'){
    if(c.src){
      body.innerHTML='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden"><video src="'+escAttr(c.src)+'" style="max-width:100%;max-height:100%" controls></video></div>';
    }else{
      var vid=extractYTId(c.url);
      if(vid) body.innerHTML='<div style="position:relative;padding-bottom:56%;height:0;overflow:hidden;border-radius:4px"><iframe src="https://www.youtube.com/embed/'+vid+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>';
      else body.innerHTML='<div class="bc-video">\u25B6 Doppio click</div>';
    }
  }else if(b.type==='text'){
    body.innerHTML='<div class="bc-text">'+(c.html||'')+'</div>';
  }else if(b.type==='audio'){
    if(c.src) body.innerHTML='<div class="bc-audio">\uD83C\uDFB5 <span>'+esc(c.label||'Audio')+'</span></div>';
    else body.innerHTML='<div class="bc-audio">\uD83C\uDFB5 Doppio click per caricare</div>';
  }else if(b.type==='notes'){
    body.innerHTML='<div class="bc-notes">'+esc(c.text||'')+'</div>';
  }else if(b.type==='embed'){
    if(c.url) body.innerHTML='<div class="bc-embed">\uD83D\uDD17 '+esc(c.url)+'</div>';
    else body.innerHTML='<div class="bc-embed">\uD83D\uDD17 Doppio click</div>';
  }
}

function removeBlock(bid){
  blocks=blocks.filter(function(b){return b.id!==bid;});
  if(selectedBlock&&selectedBlock.id===bid){selectedBlock=null;closeEditPanel();}
  renderBlocks();
}

function startDrag(e,b,el){
  e.preventDefault();
  var cv=document.getElementById('canvas');
  var cvR=cv.getBoundingClientRect();
  var elR=el.getBoundingClientRect();
  var moved=false;
  var offX=e.clientX-elR.left,offY=e.clientY-elR.top;
  el.classList.add('dragging');
  function onMove(ev){
    moved=true;
    var x=ev.clientX-cvR.left-offX;
    var y=ev.clientY-cvR.top-offY;
    x=Math.max(0,Math.min(x,cvR.width-el.offsetWidth));
    y=Math.max(0,Math.min(y,cvR.height-el.offsetHeight));
    el.style.left=(x/cvR.width*100)+'%';
    el.style.top=(y/cvR.height*100)+'%';
    b.x=Math.round(x/cvR.width*10000)/100;
    b.y=Math.round(y/cvR.height*10000)/100;
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    el.classList.remove('dragging');
    if(!moved) selectBlockById(b.id);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function startResize(e,b){
  e.preventDefault();e.stopPropagation();
  var cv=document.getElementById('canvas');
  var cvR=cv.getBoundingClientRect();
  var el=document.getElementById('blk-'+b.id);
  var startX=e.clientX,startY=e.clientY;
  var startW=el.offsetWidth,startH=el.offsetHeight;
  function onMove(ev){
    var nw=Math.max(80,startW+(ev.clientX-startX));
    var nh=Math.max(40,startH+(ev.clientY-startY));
    el.style.width=(nw/cvR.width*100)+'%';
    el.style.height=(nh/cvR.height*100)+'%';
    b.w=Math.round(nw/cvR.width*10000)/100;
    b.h=Math.round(nh/cvR.height*10000)/100;
  }
  function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function selectBlockById(bid){
  selectedBlock=null;
  for(var i=0;i<blocks.length;i++){if(blocks[i].id===bid){selectedBlock=blocks[i];break;}}
  document.querySelectorAll('.block').forEach(function(el){el.classList.remove('selected');});
  if(selectedBlock){
    var el=document.getElementById('blk-'+bid);
    if(el) el.classList.add('selected');
    openEditPanel(selectedBlock);
  }else closeEditPanel();
}

function closeEditPanel(){document.getElementById('editPanel').classList.remove('open');}

function updProp(prop,val){
  if(!selectedBlock) return;
  if(!selectedBlock.content) selectedBlock.content={};
  selectedBlock.content[prop]=val;
  refreshBlock(selectedBlock);
}

function openInlineEdit(b){
  // Photo/video/audio: trigger file picker directly
  if(b.type==='photo'||b.type==='video'||b.type==='audio'){
    var fi=document.getElementById('epFile');
    if(fi) fi.click();
    return;
  }
  if(b.type!=='title'&&b.type!=='notes'&&b.type!=='text') return;
  var el=document.getElementById('blk-'+b.id);
  if(!el) return;
  var ce=el.querySelector('.bc-title,.bc-notes,.bc-text');
  if(!ce) return;
  ce.contentEditable='true';ce.focus();
  ce.onblur=function(){
    ce.contentEditable='false';
    if(b.type==='title') b.content.text=ce.textContent;
    else if(b.type==='notes') b.content.text=ce.textContent;
    else if(b.type==='text') b.content.html=ce.innerHTML;
    openEditPanel(b);
  };
}

function handlePhotoUpload(file){
  if(!file||!selectedBlock) return;
  if(file.size>5*1024*1024){toast('Max 5MB','err');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    selectedBlock.content.src=e.target.result;
    selectedBlock.content.pending={name:file.name,b64:e.target.result.split(',')[1],mime:file.type};
    selectedBlock.content.url='';
    refreshBlock(selectedBlock);openEditPanel(selectedBlock);
  };
  reader.readAsDataURL(file);
}
function handleVideoUpload(file){
  if(!file||!selectedBlock) return;
  if(file.size>25*1024*1024){toast('Max 25MB','err');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    selectedBlock.content.src=e.target.result;
    selectedBlock.content.pending={name:file.name,b64:e.target.result.split(',')[1],mime:file.type};
    selectedBlock.content.url='';
    refreshBlock(selectedBlock);openEditPanel(selectedBlock);
  };
  reader.readAsDataURL(file);
}
function handleAudioUpload(file){
  if(!file||!selectedBlock) return;
  if(file.size>10*1024*1024){toast('Max 10MB','err');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    selectedBlock.content.src=e.target.result;
    selectedBlock.content.pending={name:file.name,b64:e.target.result.split(',')[1],mime:file.type};
    selectedBlock.content.label=selectedBlock.content.label||file.name;
    refreshBlock(selectedBlock);openEditPanel(selectedBlock);
  };
  reader.readAsDataURL(file);
}
function refreshBlock(b){
  var el=document.getElementById('blk-'+b.id);
  if(!el) return;
  var body=el.querySelector('.block-body');
  if(body) renderBlockContent(body,b);
}

document.addEventListener('mousedown',function(e){
  if(e.target===document.getElementById('canvas')){
    selectedBlock=null;
    document.querySelectorAll('.block.selected').forEach(function(el){el.classList.remove('selected');});
    closeEditPanel();
  }
});

async function savePostData(){
  if(!currentPost||!token){toast('Connetti e seleziona un post','err');return;}
  toast('Salvataggio...','');
  try{
    var data={title:currentPost.title,slug:currentPost.slug,date:currentPost.date,year:currentPost.year,campionato:currentPost.campionato,
      blocks:blocks.map(function(b){var bc=Object.assign({},b.content||{});if(bc.pending) delete bc.pending;if(bc.src&&bc.src.indexOf('data:')===0) bc.src='';return{id:b.id,type:b.type,x:b.x,y:b.y,w:b.w,h:b.h,content:bc};})
    };
    await ghPut('social/posts/'+currentPost.slug+'.json',JSON.stringify(data,null,2),'Save draft: '+currentPost.slug);
    currentPost.blockTypes=blocks.map(function(b){return b.type;});
    await saveIndex();
    toast('Bozza salvata \u2713','ok');
  }catch(e){toast('Errore: '+e.message,'err');}
}

async function publishPost(){
  if(!currentPost||!token){toast('Connetti e seleziona un post','err');return;}
  if(!blocks.length){toast('Aggiungi almeno un blocco','err');return;}
  toast('Pubblicazione...','');
  try{
    for(var i=0;i<blocks.length;i++){
      var b=blocks[i];
      var pend=b.content?b.content.pending:null;
      if(pend){
        var ext=pend.name.split('.').pop().toLowerCase();
        var fname=currentPost.slug+'-'+b.id+'.'+ext;
        await ghPutBinary('social/media/'+fname,pend.b64,'Upload: '+fname);
        b.content.src='social/media/'+fname;
        b.content.pending=null;
      }
    }
    var data={title:currentPost.title,slug:currentPost.slug,date:currentPost.date,year:currentPost.year,campionato:currentPost.campionato,
      blocks:blocks.map(function(b){var bc=Object.assign({},b.content||{});if(bc.pending) delete bc.pending;return{id:b.id,type:b.type,x:b.x,y:b.y,w:b.w,h:b.h,content:bc};})
    };
    await ghPut('social/posts/'+currentPost.slug+'.json',JSON.stringify(data,null,2),'Save: '+currentPost.slug);
    var cv=document.getElementById('canvas');
    var cvRect=cv.getBoundingClientRect();
    var canvasRatio=cvRect.height/cvRect.width;
    var html=generatePostHTML(currentPost,blocks,canvasRatio);
    await ghPut('social/posts/'+currentPost.slug+'.html',html,'Publish: '+currentPost.slug);
    currentPost.blockTypes=blocks.map(function(b){return b.type;});
    await saveIndex();
    toast('Pubblicato \u2713','ok');
  }catch(e){toast('Errore: '+e.message,'err');}
}

      var vid=extractYTId(c.url||'');
      o+='<div class="cb cb-v" style="'+st+'">';
      if(vsrc) o+='<video src="'+escAttr(vsrc)+'" controls style="width:100%;height:100%;object-fit:contain"></video>';
      else if(vid) o+='<iframe src="https://www.youtube.com/embed/'+vid+'" allowfullscreen loading="lazy"></iframe>';
      o+='</div>\n';
    }else if(b.type==='text'){
      o+='<div class="cb cb-x" style="'+st+'">'+(c.html||'')+'</div>\n';
    }else if(b.type==='audio'){
      var asrc=resolveSrc(c.src||c.url||'');
      o+='<div class="cb cb-a" style="'+st+'"><span>'+esc(c.label||'Audio')+'</span>';
      if(asrc) o+='<audio controls src="'+escAttr(asrc)+'"></audio>';
      o+='</div>\n';
    }else if(b.type==='notes'){
      o+='<div class="cb cb-n" style="'+st+'">'+esc(c.text||'')+'</div>\n';
    }else if(b.type==='embed'){
      o+='<div class="cb cb-e" style="'+st+'">';
      if(c.url) o+='<iframe src="'+escAttr(c.url)+'" allowfullscreen loading="lazy"></iframe>';
      o+='</div>\n';
    }
  });
  o+='</div></div>\n<'+'/body>\n<'+'/html>';
  return o;
}

function resolveSrc(src){
  if(!src) return '';
  if(src.indexOf('social/media/')===0) return '../media/'+src.replace('social/media/','');
  if(src.indexOf('data:')===0) return '';
  return src;
}
function extractYTId(url){
  if(!url) return null;
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}
function toast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+(type||'');
  clearTimeout(t._t);t._t=setTimeout(function(){t.className='';},3500);
}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
