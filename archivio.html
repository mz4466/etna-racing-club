<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Archivio — Etna Racing Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300,400,500,600,700&family=Russo+One&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --volcano-red:#ff5014; --lava-orange:#ff8c42; --fire-yellow:#ffa500;
      --cream:#fff5e6; --smoke:#c9b8a3;
      --gold:#c9a227; --gold-hi:#e8c547; --gold-dim:rgba(201,162,39,0.10);
      --bg:#07070f; --bg-card:rgba(45,10,10,0.88); --bg-card2:rgba(18,5,5,0.92);
      --border:rgba(255,80,20,0.10); --border-hi:rgba(255,80,20,0.22);
      --blue:#4fc3f7;
    }

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:'Barlow Condensed',sans-serif;
      background: linear-gradient(to bottom, #000000 0%, #0f0404 40%, #1b0606 100%);
      color:var(--cream);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ── HERO ── */
    .hero-section { position:relative; padding:40px 20px 70px; overflow:hidden; }

    .volcano-backdrop {
      position:absolute; top:-10%; left:0; width:100%; height:65%;
      background:
        radial-gradient(ellipse at 50% 120%, rgba(255,80,20,0.20) 0%, transparent 45%),
        radial-gradient(ellipse at 80% 80%, rgba(255,140,66,0.10) 0%, transparent 40%);
      z-index:0; pointer-events:none;
    }

    .embers-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; opacity:0.55; }
    .ember { position:absolute; width:3px; height:3px; background:var(--fire-yellow); border-radius:50%; box-shadow:0 0 8px rgba(255,140,66,0.8); animation:float-up linear infinite; }
    .ember:nth-child(1){left:8%;animation-duration:14s;animation-delay:0s;}
    .ember:nth-child(2){left:18%;animation-duration:11s;animation-delay:2s;}
    .ember:nth-child(3){left:28%;animation-duration:13s;animation-delay:4s;}
    .ember:nth-child(4){left:42%;animation-duration:15s;animation-delay:1s;}
    .ember:nth-child(5){left:52%;animation-duration:12s;animation-delay:3s;}
    .ember:nth-child(6){left:62%;animation-duration:16s;animation-delay:5s;}
    .ember:nth-child(7){left:72%;animation-duration:13s;animation-delay:2.5s;}
    .ember:nth-child(8){left:82%;animation-duration:15s;animation-delay:4.5s;}
    .ember:nth-child(9){left:92%;animation-duration:14s;animation-delay:1.5s;}

    @keyframes float-up {
      0%  { transform:translateY(100vh) scale(0); opacity:0; }
      20% { opacity:1; }
      80% { opacity:0.8; }
      100%{ transform:translateY(-80px) scale(1.4); opacity:0; }
    }

    /* ── CONTENT ── */
    .content { position:relative; z-index:10; max-width:1000px; margin:0 auto; padding:24px; }

    .logo-row { display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:16px; }
    .club-logo { width:200px; filter:drop-shadow(0 0 28px rgba(255,80,20,0.85)); }
    .gt7-logo  { width:160px; filter:drop-shadow(0 0 18px rgba(0,0,0,0.6)); }

    h1.page-title {
      font-family:'Russo One',sans-serif;
      font-size:clamp(26px,4.5vw,44px);
      color:var(--fire-yellow);
      text-transform:uppercase;
      text-align:center;
      margin-bottom:6px;
      letter-spacing:4px;
    }

    p.lead { text-align:center; color:var(--smoke); margin-bottom:28px; font-size:clamp(13px,2vw,16px); }

    .back-link {
      display:inline-block; margin-bottom:18px; color:var(--cream); text-decoration:none;
      background:transparent; border:2px solid rgba(255,80,20,0.14); padding:8px 14px;
      border-radius:10px; transition:all .18s; font-family:'Barlow Condensed',sans-serif; font-size:14px;
    }
    .back-link:hover { border-color:var(--volcano-red); transform:translateY(-2px); }

    /* ── ARCHIVE CARD ── */
    .archive-card {
      background:linear-gradient(180deg, rgba(45,10,10,0.88), rgba(18,5,5,0.92));
      border:2px solid var(--border-hi);
      padding:26px; border-radius:16px;
      box-shadow:0 12px 40px rgba(0,0,0,0.6);
      max-width:860px; margin:0 auto 40px;
    }

    /* Loading / empty */
    .state-msg {
      text-align:center; padding:40px 20px;
      font-family:'Teko',sans-serif; font-size:16px;
      letter-spacing:3px; color:var(--smoke); text-transform:uppercase;
    }
    .state-msg .ei { font-size:40px; margin-bottom:12px; display:block; }

    /* ── YEAR BLOCK ── */
    .year { margin-bottom:6px; }

    .year-button {
      width:100%; display:flex; align-items:center; justify-content:space-between;
      background:transparent; color:var(--cream); border:none; padding:14px 16px;
      font-size:20px; font-family:'Teko',sans-serif; letter-spacing:3px; cursor:pointer;
      text-transform:uppercase; border-radius:10px; transition:background .18s,transform .12s;
    }
    .year-button:hover { background:rgba(255,80,20,0.05); transform:translateY(-1px); }

    .arrow { transition:transform .18s ease; color:var(--smoke); font-size:14px; }
    .arrow.open { transform:rotate(90deg); color:var(--fire-yellow); }

    .year-list { margin-top:6px; padding:6px 10px 10px 10px; list-style:none; display:none; border-radius:8px; background:linear-gradient(90deg,rgba(255,80,20,0.02),transparent); }
    .year-list.show { display:block; }
    .year-list > li { margin:7px 0; }

    /* ── CHAMPIONSHIP TOGGLE ── */
    .item-toggle {
      width:100%; text-align:left;
      background:linear-gradient(90deg,rgba(255,80,20,0.04),rgba(0,0,0,0));
      border:1px solid rgba(201,184,163,0.07);
      padding:10px 13px; color:var(--cream); border-radius:8px; cursor:pointer;
      font-family:'Barlow Condensed',sans-serif; font-size:15px;
      transition:background .12s,transform .08s;
      display:flex; align-items:center; justify-content:space-between;
    }
    .item-toggle:hover { background:linear-gradient(90deg,rgba(255,80,20,0.11),rgba(0,0,0,0)); transform:translateY(-1px); }

    .champ-label { display:flex; align-items:center; gap:10px; }
    .champ-cat-pill {
      font-family:'Teko',sans-serif; font-size:11px; letter-spacing:2px;
      background:rgba(201,162,39,0.15); border:1px solid rgba(201,162,39,0.3);
      color:var(--gold-hi); border-radius:12px; padding:2px 8px; text-transform:uppercase; flex-shrink:0;
    }
    .champ-status-pill {
      font-family:'Teko',sans-serif; font-size:11px; letter-spacing:2px;
      border-radius:12px; padding:2px 8px; text-transform:uppercase; flex-shrink:0;
    }
    .pill-incorso  { background:rgba(255,165,0,0.15); border:1px solid rgba(255,165,0,0.35); color:#ffa500; }
    .pill-prossimo { background:rgba(138,128,152,0.15); border:1px solid rgba(138,128,152,0.3); color:#8a8098; }
    .pill-concluso { background:rgba(39,174,96,0.12); border:1px solid rgba(39,174,96,0.3); color:#27ae60; }

    /* ── CHILD LIST (rounds) ── */
    .child-list { margin-top:7px; padding-left:14px; list-style:none; display:none; }
    .child-list.show { display:block; }
    .child-list li { margin:6px 0; }

    .child-item {
      background:linear-gradient(90deg,rgba(255,80,20,0.03),transparent);
      border:1px solid rgba(201,184,163,0.06);
      padding:9px 12px; border-radius:8px; color:var(--cream); cursor:pointer;
      transition:background .12s,transform .08s;
      text-align:left; font-family:'Barlow Condensed',sans-serif; font-size:14px;
      display:flex; align-items:center; gap:10px; text-decoration:none;
    }
    .child-item:hover { background:linear-gradient(90deg,rgba(255,80,20,0.11),transparent); transform:translateY(-1px); }
    .child-item.no-results { opacity:0.45; cursor:default; pointer-events:none; }

    .round-num {
      font-family:'Russo One',sans-serif; font-size:11px; color:#000;
      background:var(--gold); border-radius:4px; padding:1px 6px; flex-shrink:0;
    }
    .round-circuit { flex:1; }
    .round-date { font-size:12px; color:var(--smoke); flex-shrink:0; }
    .round-tick { color:#27ae60; font-size:13px; flex-shrink:0; }
    .round-pending { color:var(--smoke); font-size:12px; flex-shrink:0; opacity:0.5; }

    /* classifica finale */
    .child-item.classifica-finale {
      margin-top:12px; padding-top:12px;
      border-top:1px solid rgba(255,80,20,0.22);
      background:linear-gradient(90deg,rgba(255,215,0,0.12),transparent);
      border-color:rgba(255,215,0,0.28); font-weight:600;
    }
    .child-item.classifica-finale:hover {
      background:linear-gradient(90deg,rgba(255,215,0,0.22),transparent);
      border-color:rgba(255,215,0,0.5);
    }

    .note { margin-top:14px; color:var(--smoke); font-size:13px; padding:0 4px; }

    /* ── FOOTER ── */
    .footer-section { text-align:center; margin-top:40px; padding:28px 20px; border-top:2px solid rgba(255,80,20,0.10); }
    .footer-motto { font-family:'Teko',sans-serif; color:var(--smoke); margin-bottom:8px; letter-spacing:2px; text-transform:uppercase; }
    .footer-copyright { color:rgba(201,184,163,0.55); font-size:13px; }

    @media(max-width:600px){
      .club-logo{width:140px;} .gt7-logo{width:120px;}
      .archive-card{padding:16px;}
      .year-button{font-size:17px;padding:11px;}
    }
  </style>
</head>
<body>
<section class="hero-section">
  <div class="volcano-backdrop"></div>
  <div class="embers-container">
    <div class="ember"></div><div class="ember"></div><div class="ember"></div>
    <div class="ember"></div><div class="ember"></div><div class="ember"></div>
    <div class="ember"></div><div class="ember"></div><div class="ember"></div>
  </div>

  <div class="content">
    <div class="logo-row">
      <img class="club-logo" src="etna-logo.jpg" alt="Etna Racing Club" loading="lazy">
      <img class="gt7-logo"  src="gt7.jpg"        alt="Gran Turismo 7"   loading="lazy">
    </div>

    <a href="index.html" class="back-link">← Torna alla Home</a>

    <h1 class="page-title">Archivio</h1>
    <p class="lead">Seleziona la stagione e la categoria per vedere i risultati.</p>

    <div class="archive-card" id="archiveCard">
      <div class="state-msg"><span class="ei">⏳</span>Caricamento archivio...</div>
    </div>

    <div class="footer-section">
      <p class="footer-motto">🏁 Gareggia con Onore • Rispetta le Regole • Divertiti 🌋</p>
      <p class="footer-copyright" id="cfg-copyright">© 2026 Etna Racing Club • Sicilia, Italia</p>
    </div>
  </div>
</section>

<script>
const OWNER  = 'mz4466';
const REPO   = 'etna-racing-club';
const BRANCH = 'main';
const BASE   = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
const API    = `https://api.github.com/repos/${OWNER}/${REPO}`;

async function loadArchive(){
  try {
    // 1. Load calendario.json (direct relative fetch — both files in repo root)
    const calRes = await fetch(`${BASE}/calendario.json?_=${Date.now()}`);
    if(!calRes.ok) throw new Error('calendario.json non trovato');
    const campionati = await calRes.json();
    if(!campionati.length){ showEmpty(); return; }

    // 2. List ALL files in risultati/ via GitHub API (no auth needed for public repos)
    //    Then fetch each JSON to read champId + garaNum — fully reliable, no regex on filenames.
    //    Falls back to index.json if the API call fails.
    let raceIndex = []; // [{ json, html, champId, garaNum, circuit }]
    try {
      const dirRes = await fetch(`${API}/contents/risultati?ref=${BRANCH}`);
      if(dirRes.ok){
        const dirFiles = await dirRes.json();
        const jsonFiles = Array.isArray(dirFiles)
          ? dirFiles.filter(f=>f.type==='file'&&f.name.endsWith('.json')&&f.name!=='index.json')
          : [];
        // Fetch all JSON files in parallel and parse champId/garaNum
        const parsed = await Promise.all(jsonFiles.map(async f=>{
          try {
            const r = await fetch(`${BASE}/risultati/${f.name}?_=${Date.now()}`);
            if(!r.ok) return null;
            const d = await r.json();
            // circuit: extract from filename after rN segment
            const parts = f.name.replace('.json','').split('-');
            const rIdx  = parts.findIndex(p=>/^r\d+$/i.test(p));
            const circuit = rIdx>=0 && parts.length>rIdx+1
              ? parts.slice(rIdx+1).map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ')
              : '';
            return {
              json: f.name,
              html: f.name.replace('.json','.html'),
              champId:  d.champId  || '',
              garaNum:  parseInt(d.garaNum)||0,
              circuit
            };
          } catch{ return null; }
        }));
        raceIndex = parsed.filter(Boolean);
      }
    } catch {}

    // Fallback: use index.json + filename regex if API gave nothing
    let legacyFiles = [];
    if(!raceIndex.length){
      try {
        const rfRes = await fetch(`${BASE}/risultati/index.json?_=${Date.now()}`);
        if(rfRes.ok){ const rf=await rfRes.json(); legacyFiles=(rf||[]).filter(f=>f.endsWith('.json')); }
      } catch {}
    }

    // 3. Group by stagione, then categoria
    const byStagione = {};
    campionati.forEach(c => {
      const key = c.stagione ? c.stagione : (c.year ? String(c.year) : 'Archivio');
      if (!byStagione[key]) byStagione[key] = { label: key, year: parseInt(c.year)||0, champs: [] };
      byStagione[key].champs.push(c);
    });

    // Sort stagioni: most recent first
    const stagioni = Object.values(byStagione).sort((a,b) => b.year - a.year);

    // 4. Build HTML
    const card = document.getElementById('archiveCard');
    card.innerHTML = '';

    stagioni.forEach((stagione, si) => {
      const stDiv = document.createElement('div');
      stDiv.className = 'year';

      const listId = `stagione-list-${si}`;
      stDiv.innerHTML = `
        <button class="year-button" data-target="${listId}">
          <span>${stagione.label}</span>
          <span class="arrow ${si===0?'open':''}">▶</span>
        </button>
        <div id="${listId}" class="year-list ${si===0?'show':''}" role="list"></div>
      `;

      const listEl = stDiv.querySelector('#' + listId);

      // Group champs by categoria
      const byCat = {};
      stagione.champs.forEach(c => {
        const cat = c.cat || 'Altro';
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(c);
      });

      Object.keys(byCat).forEach((cat, cati) => {
        const catHeader = document.createElement('div');
        catHeader.style.cssText = 'font-family:Teko,sans-serif;font-size:11px;letter-spacing:3px;color:rgba(201,162,39,0.5);text-transform:uppercase;padding:10px 4px 4px;border-bottom:1px solid rgba(201,162,39,0.1);margin-bottom:6px;margin-top:4px;';
        catHeader.textContent = cat;
        listEl.appendChild(catHeader);

        const catUl = document.createElement('ul');
        catUl.style.cssText = 'list-style:none;margin-bottom:8px;';
        listEl.appendChild(catUl);

        byCat[cat].forEach((c, ci) => {
          const champDomId  = 'champ-' + si + '-' + cati + '-' + ci;
          const totalRounds = c.totalRounds || 0;

          const statusNorm  = (c.status||'').toLowerCase().replace(/-/g,' ').trim();
          const statusClass = statusNorm==='in corso'?'pill-incorso':statusNorm==='concluso'?'pill-concluso':'pill-prossimo';
          const statusLabel = statusNorm==='in corso'?'🔥 In Corso':statusNorm==='concluso'?'✅ Concluso':'⏳ Prossimamente';

          let roundsHTML = '';
          for (let r = 1; r <= totalRounds; r++) {
            let matchEntry = null;

            if (raceIndex.length) {
              matchEntry = raceIndex.find(e => e.garaNum===r && (
                e.champId===c.id ||
                e.champId===(c.slug||'') ||
                e.champId===String(campionati.indexOf(c))
              ));
            }

            if (!matchEntry && legacyFiles.length) {
              const pattern = new RegExp(
                (c.year||'') + '.*('+
                (c.slug||'').replace(/[^a-z0-9]/gi,'.?') + '|' +
                (c.name||'').replace(/[^a-z0-9]/gi,'.?') + ').*r' + r + '\.json','i'
              );
              const mf = legacyFiles.find(f => pattern.test(f));
              if (mf) {
                const parts = mf.replace('.json','').split('-');
                const rIdx  = parts.findIndex(p => /^r\d+$/i.test(p));
                const circuit = rIdx>=0 && parts.length>rIdx+1
                  ? parts.slice(rIdx+1).map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ')
                  : 'Round ' + r;
                matchEntry = { json: mf, html: mf.replace('.json','.html'), circuit };
              }
            }

            const hasResult    = !!matchEntry;
            const circuitLabel = hasResult && matchEntry.circuit ? matchEntry.circuit : 'Round ' + r;
            const htmlFile     = hasResult ? 'risultati/' + matchEntry.html : null;
            const tick         = hasResult ? '<span class="round-tick">✅</span>' : '<span class="round-pending">—</span>';
            const itemClass    = hasResult ? 'child-item' : 'child-item no-results';
            const tag          = hasResult ? '<a href="' + htmlFile + '" class="' + itemClass + '">' : '<div class="' + itemClass + '">';
            const endTag       = hasResult ? '</a>' : '</div>';

            roundsHTML += '<li>' + tag +
              '<span class="round-num">R' + r + '</span>' +
              '<span class="round-circuit">' + circuitLabel + '</span>' +
              tick + endTag + '</li>';
          }

          if (statusNorm === 'concluso') {
            const classFname    = 'classifica-' + (c.slug||c.year+'-'+ci) + '.html';
            const hasClassifica = raceIndex.some(e => e.json===classFname.replace('.html','.json'))
                               || legacyFiles.includes(classFname.replace('.html','.json'));
            if (hasClassifica) {
              roundsHTML += '<li><a href="' + classFname + '" class="child-item classifica-finale">🏆 Classifica Finale ' + esc(c.name) + ' ' + esc(String(c.year||'')) + '</a></li>';
            }
          }

          const li = document.createElement('li');
          li.style.marginBottom = '6px';
          li.innerHTML =
            '<button class="item-toggle" data-target="' + champDomId + '">' +
              '<span class="champ-label">' +
                esc(c.name||'?') +
                (c.cars ? '<span style="font-size:12px;color:var(--smoke);margin-left:6px;">· ' + esc(c.cars) + '</span>' : '') +
              '</span>' +
              '<span style="display:flex;align-items:center;gap:8px;">' +
                '<span class="champ-status-pill ' + statusClass + '">' + statusLabel + '</span>' +
                '<span class="arrow">▶</span>' +
              '</span>' +
            '</button>' +
            '<ul id="' + champDomId + '" class="child-list" role="list">' + roundsHTML + '</ul>';
          catUl.appendChild(li);
        });
      });

      card.appendChild(stDiv);
    });

    // Add note
    const note = document.createElement('p');
    note.className='note';
    note.textContent='Le gare con risultati disponibili sono contrassegnate con ✅. Clicca per vedere i dettagli.';
    card.appendChild(note);

    // Wire up toggles
    wireToggles();

  } catch(e) {
    console.error(e);
    document.getElementById('archiveCard').innerHTML=`
      <div class="state-msg">
        <span class="ei">📭</span>
        Archivio non disponibile<br>
        <span style="font-size:13px;letter-spacing:1px;opacity:.6;">${e.message}</span>
      </div>`;
  }
}

function showEmpty(){
  document.getElementById('archiveCard').innerHTML=`
    <div class="state-msg"><span class="ei">🏎️</span>Nessun campionato in archivio</div>`;
}

function wireToggles(){
  document.querySelectorAll('.year-button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const list=document.getElementById(btn.dataset.target);
      const open=list.classList.toggle('show');
      const arrow=btn.querySelector('.arrow');
      open?arrow.classList.add('open'):arrow.classList.remove('open');
    });
  });
  document.querySelectorAll('.item-toggle').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const list=document.getElementById(btn.dataset.target);
      const open=list.classList.toggle('show');
      const arrow=btn.querySelector('.arrow');
      open?arrow.classList.add('open'):arrow.classList.remove('open');
    });
  });
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

loadArchive();
</script>
<script src="copyright.js"></script>
<script src="nav.js"></script>
</body>
</html>
