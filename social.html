<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f;--card:#0e0e1c;--card2:#0a0a16;
  --border:rgba(201,184,163,0.08);--border-hi:rgba(201,184,163,0.16);
  --gold:#c9a227;--gold-hi:#e8c547;--gold-dim:rgba(201,162,39,0.10);
  --red:#ff5014;--orange:#ff8c42;
  --text:#e8e0d0;--muted:#8a8098;--dim:#5a5470;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh}
/* HEADER */
.site-header{background:linear-gradient(180deg,rgba(10,10,24,0.98),var(--bg));border-bottom:2px solid var(--gold);padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:52px;height:52px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 0 10px rgba(201,162,39,0.3))}
.brand-name{font-family:'Russo One',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px}
.brand-sub{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.back-btn{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border-hi);padding:7px 14px;border-radius:7px;transition:all .2s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
/* PAGE TITLE */
.page-hero{padding:28px 28px 20px;text-align:center}
.page-title{font-family:'Russo One',sans-serif;font-size:clamp(28px,5vw,46px);color:var(--gold);letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 30px rgba(201,162,39,0.4)}
.page-sub{font-family:'Teko',sans-serif;font-size:15px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:4px}
/* NAV BARS */
.nav-strip{padding:0 20px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.nav-strip::-webkit-scrollbar{display:none}
.nav-inner{display:inline-flex;gap:6px;padding:10px 0}
.nav-pill{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:2px;padding:5px 18px;border-radius:20px;border:1px solid var(--border-hi);color:var(--dim);cursor:pointer;text-transform:uppercase;transition:all .15s;white-space:nowrap;user-select:none}
.nav-pill:hover{border-color:var(--gold);color:var(--muted)}
.nav-pill.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
.nav-pill.race-pill.active{background:rgba(255,80,20,0.08);border-color:rgba(255,80,20,0.4);color:var(--orange)}
.nav-divider{height:1px;background:var(--border);margin:0 20px}
/* MEDIA TYPE TABS */
.type-bar{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap}
.type-tab{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:2px;padding:5px 16px;border-radius:20px;border:1px solid var(--border-hi);color:var(--dim);cursor:pointer;text-transform:uppercase;transition:all .15s}
.type-tab.active{background:var(--card);border-color:var(--border-hi);color:var(--text)}
/* CONTENT AREA */
.content{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.photo-item{border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--border);transition:border-color .2s,transform .15s;background:var(--card)}
.photo-item:hover{border-color:var(--gold);transform:scale(1.02)}
.photo-item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.photo-caption{padding:7px 10px;font-family:'Teko',sans-serif;font-size:13px;letter-spacing:1px;color:var(--muted)}
/* VIDEO LIST */
.video-list{display:flex;flex-direction:column;gap:10px}
.video-card{background:var(--card);border:1px solid var(--border-hi);border-radius:10px;overflow:hidden;transition:border-color .2s}
.video-card:hover{border-color:var(--gold)}
.video-embed{width:100%;aspect-ratio:16/9}
.video-embed iframe{width:100%;height:100%;border:none;display:block}
.video-meta{padding:12px 16px}
.video-title{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:1px;color:var(--text);margin-bottom:3px}
.video-sub{font-size:13px;color:var(--dim)}
/* ARTICLE LIST */
.article-list{display:flex;flex-direction:column;gap:12px}
.article-card{background:var(--card);border:1px solid var(--border-hi);border-radius:10px;padding:20px 22px;transition:border-color .2s}
.article-card:hover{border-color:var(--gold)}
.article-title{font-family:'Teko',sans-serif;font-size:22px;letter-spacing:1px;color:var(--gold);margin-bottom:10px}
.article-body{font-size:15px;color:var(--muted);line-height:1.7}
.article-body a{color:var(--gold);text-decoration:none}
.article-body a:hover{text-decoration:underline}
.article-body strong,.article-body b{color:var(--text)}
.article-body em,.article-body i{color:var(--muted)}
.article-date{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:2px;color:var(--dim);margin-top:10px;text-transform:uppercase}
/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;align-items:center;justify-content:center;padding:20px}
.lightbox.open{display:flex}
.lightbox-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:6px}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:0.6;transition:opacity .2s}
.lightbox-close:hover{opacity:1}
.lightbox-caption{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-family:'Teko',sans-serif;font-size:15px;letter-spacing:2px;color:rgba(255,255,255,0.6);white-space:nowrap}
/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;font-family:'Teko',sans-serif;font-size:14px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.empty-icon{font-size:40px;margin-bottom:12px;display:block}
/* LOADING */
.loading{text-align:center;padding:40px;color:var(--dim);font-family:'Teko',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a href="index.html"><img src="etna-logo.jpg" alt="ERC" onerror="this.style.display='none'"></a>
    <div>
      <div class="brand-name">Etna Racing Club</div>
      <div class="brand-sub">Social</div>
    </div>
  </div>
  <a href="index.html" class="back-btn">← Home</a>
</header>

<div class="page-hero">
  <h1 class="page-title">Social</h1>
  <p class="page-sub">Foto · Video · Interviste · Articoli</p>
</div>

<!-- YEAR NAV -->
<div class="nav-strip" id="yearNav"><div class="nav-inner" id="yearInner"></div></div>
<div class="nav-divider"></div>
<!-- CHAMPIONSHIP NAV -->
<div class="nav-strip" id="champNav" style="display:none"><div class="nav-inner" id="champInner"></div></div>
<div class="nav-divider" id="champDivider" style="display:none"></div>
<!-- RACE NAV -->
<div class="nav-strip" id="raceNav" style="display:none"><div class="nav-inner" id="raceInner"></div></div>
<div class="nav-divider" id="raceDivider" style="display:none"></div>

<!-- MEDIA TYPE TABS -->
<div class="type-bar" id="typeBar" style="display:none">
  <div class="type-tab" data-type="photos">📷 Foto</div>
  <div class="type-tab" data-type="videos">🎥 Video</div>
  <div class="type-tab" data-type="interviews">🎤 Interviste</div>
  <div class="type-tab" data-type="articles">📝 Articoli</div>
</div>

<div class="content" id="mainContent">
  <div class="loading" id="loadingMsg">Caricamento...</div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/mz4466/etna-racing-club/main';
const SOCIAL_BASE = RAW + '/social';

var state = { year: null, champ: null, race: null, type: 'photos' };
var socialIndex = [];

async function fetchJSON(url) {
  var r = await fetch(url + '?_=' + Date.now());
  if (!r.ok) return null;
  return await r.json();
}

async function init() {
  var idx = await fetchJSON(SOCIAL_BASE + '/index.json');
  if (!idx || !idx.length) {
    document.getElementById('loadingMsg').innerHTML = '<span class="empty-icon">📭</span>Nessun contenuto disponibile';
    return;
  }
  socialIndex = idx;
  document.getElementById('loadingMsg').style.display = 'none';

  // Build year tabs
  var years = [...new Set(idx.map(function(c){ return c.year; }))].sort(function(a,b){ return b-a; });
  var yearInner = document.getElementById('yearInner');
  years.forEach(function(y, i) {
    var pill = document.createElement('div');
    pill.className = 'nav-pill' + (i===0?' active':'');
    pill.textContent = y;
    pill.onclick = function() { selectYear(y); };
    yearInner.appendChild(pill);
  });

  selectYear(years[0]);
}

function selectYear(year) {
  state.year = year; state.champ = null; state.race = null;
  document.querySelectorAll('#yearInner .nav-pill').forEach(function(p){ p.classList.toggle('active', p.textContent==year); });

  var yearChamps = socialIndex.filter(function(c){ return String(c.year)===String(year); });
  var champInner = document.getElementById('champInner');
  champInner.innerHTML = '';
  yearChamps.forEach(function(c, i) {
    var pill = document.createElement('div');
    pill.className = 'nav-pill' + (i===0?' active':'');
    pill.textContent = c.name;
    pill.onclick = function() { selectChamp(c); };
    champInner.appendChild(pill);
  });
  document.getElementById('champNav').style.display = 'block';
  document.getElementById('champDivider').style.display = 'block';

  if (yearChamps.length) selectChamp(yearChamps[0]);
}

function selectChamp(champ) {
  state.champ = champ; state.race = null;
  document.querySelectorAll('#champInner .nav-pill').forEach(function(p){ p.classList.toggle('active', p.textContent===champ.name); });

  var raceInner = document.getElementById('raceInner');
  raceInner.innerHTML = '';
  (champ.races||[]).forEach(function(race, i) {
    var pill = document.createElement('div');
    pill.className = 'nav-pill race-pill' + (i===0?' active':'');
    pill.textContent = race.label;
    pill.onclick = function() { selectRace(champ, race); };
    raceInner.appendChild(pill);
  });
  document.getElementById('raceNav').style.display = 'block';
  document.getElementById('raceDivider').style.display = 'block';
  document.getElementById('typeBar').style.display = 'flex';
  setActiveType(state.type);

  if ((champ.races||[]).length) selectRace(champ, champ.races[0]);
  else { document.getElementById('mainContent').innerHTML = '<div class="empty"><span class="empty-icon">🏁</span>Nessuna gara disponibile</div>'; }
}

function selectRace(champ, race) {
  state.race = race;
  document.querySelectorAll('#raceInner .nav-pill').forEach(function(p){ p.classList.toggle('active', p.textContent===race.label); });
  loadContent(champ, race, state.type);
}

function setActiveType(type) {
  state.type = type;
  document.querySelectorAll('.type-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.type===type); });
  if (state.champ && state.race) loadContent(state.champ, state.race, type);
}

document.querySelectorAll('.type-tab').forEach(function(t){ t.onclick = function(){ setActiveType(t.dataset.type); }; });

async function loadContent(champ, race, type) {
  var content = document.getElementById('mainContent');
  content.innerHTML = '<div class="loading">Caricamento...</div>';

  var path = SOCIAL_BASE + '/' + champ.year + '/' + champ.slug + '/' + race.slug + '/index.json';
  var items = await fetchJSON(path);
  if (!items || !items.length) {
    content.innerHTML = '<div class="empty"><span class="empty-icon">📂</span>Nessun contenuto per questa gara</div>';
    return;
  }

  var filtered = items.filter(function(item){ return item.type === type || (type==='photos' && item.type==='photo') || (type==='videos' && item.type==='video') || (type==='interviews' && item.type==='interview') || (type==='articles' && item.type==='article'); });

  if (!filtered.length) {
    content.innerHTML = '<div class="empty"><span class="empty-icon">📂</span>Nessun contenuto in questa categoria</div>';
    return;
  }

  if (type === 'photos') {
    var grid = '<div class="photo-grid">';
    filtered.forEach(function(item) {
      var src = item.url || (SOCIAL_BASE + '/' + champ.year + '/' + champ.slug + '/' + race.slug + '/' + item.file);
      grid += '<div class="photo-item" onclick="openLightbox(\'' + src.replace(/'/g,'%27') + '\',\'' + esc(item.title||'') + '\')">'
        + '<img src="' + src + '" alt="' + esc(item.title||'') + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'">'
        + (item.title ? '<div class="photo-caption">' + esc(item.title) + '</div>' : '')
        + '</div>';
    });
    grid += '</div>';
    content.innerHTML = grid;
  }
  else if (type === 'videos' || type === 'interviews') {
    var list = '<div class="video-list">';
    filtered.forEach(function(item) {
      var embedUrl = item.url ? youtubeEmbed(item.url) : null;
      list += '<div class="video-card">';
      if (embedUrl) {
        list += '<div class="video-embed"><iframe src="' + embedUrl + '" allowfullscreen loading="lazy"></iframe></div>';
      }
      list += '<div class="video-meta"><div class="video-title">' + esc(item.title||'Video') + '</div>';
      if (item.desc) list += '<div class="video-sub">' + esc(item.desc) + '</div>';
      list += '</div></div>';
    });
    list += '</div>';
    content.innerHTML = list;
  }
  else if (type === 'articles') {
    var art = '<div class="article-list">';
    filtered.forEach(function(item) {
      art += '<div class="article-card">'
        + '<div class="article-title">' + esc(item.title||'Articolo') + '</div>'
        + '<div class="article-body">' + (item.body||'') + '</div>'
        + (item.date ? '<div class="article-date">' + esc(item.date) + '</div>' : '')
        + '</div>';
    });
    art += '</div>';
    content.innerHTML = art;
  }
}

function youtubeEmbed(url) {
  var match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?/\s]{11})/);
  return match ? 'https://www.youtube.com/embed/' + match[1] : null;
}

function openLightbox(src, caption) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxCaption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  if (!e || e.target === document.getElementById('lightbox') || e.target.classList.contains('lightbox-close')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('lightbox').classList.remove('open'); });

function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

init();
</script>
<script src="copyright.js"></script>
</body>
</html>
