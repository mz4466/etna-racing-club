<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Teko:wght@300;400;500;600&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070f;--card:#0e0e1c;--card2:#0a0a16;
  --border:rgba(201,184,163,0.08);--border-hi:rgba(201,184,163,0.16);
  --gold:#c9a227;--gold-hi:#e8c547;--gold-dim:rgba(201,162,39,0.10);
  --red:#ff5014;--orange:#ff8c42;
  --text:#e8e0d0;--muted:#8a8098;--dim:#5a5470;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;min-height:100vh;padding-top:54px}
.page-hero{padding:28px 28px 16px;text-align:center}
.page-title{font-family:'Russo One',sans-serif;font-size:clamp(28px,5vw,46px);color:var(--gold);letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 30px rgba(201,162,39,0.4)}
.page-sub{font-family:'Teko',sans-serif;font-size:15px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-top:4px}
.social-layout{max-width:1200px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:1fr 280px;gap:24px}
.main-col{display:flex;flex-direction:column;gap:16px}
.side-col{display:flex;flex-direction:column;gap:0}
.badge-latest{display:inline-flex;align-items:center;gap:4px;font-family:'Teko',sans-serif;font-size:10px;letter-spacing:2px;padding:3px 10px;border-radius:10px;background:var(--gold-dim);border:1px solid rgba(201,162,39,0.25);color:var(--gold-hi);text-transform:uppercase;margin-bottom:8px}
.section-label{font-family:'Teko',sans-serif;font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.post-card{background:var(--card);border:1px solid var(--border-hi);border-radius:10px;overflow:hidden;position:relative;cursor:pointer;transition:border-color .2s;text-decoration:none;color:inherit;display:block}
.post-card:hover{border-color:rgba(201,162,39,0.35)}
.post-card-body{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.post-card-info{flex:1;min-width:0}
.post-card-title{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:0.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-card-title.big{font-size:22px}
.post-card-meta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.post-badges{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.post-badge{font-family:'Teko',sans-serif;font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:8px;text-transform:uppercase}
.pb-title{background:rgba(201,162,39,0.1);color:var(--gold)}
.pb-photo{background:rgba(52,152,219,0.1);color:#3498db}
.pb-video{background:rgba(231,76,60,0.1);color:#e74c3c}
.pb-text{background:rgba(39,174,96,0.1);color:#27ae60}
.pb-audio{background:rgba(155,89,182,0.1);color:#9b59b6}
.pb-notes{background:rgba(255,140,66,0.1);color:#ff8c42}
.expand-btn{width:34px;height:34px;border-radius:8px;background:rgba(7,7,15,0.6);border:1px solid rgba(201,162,39,0.2);display:flex;align-items:center;justify-content:center;color:var(--gold-hi);font-size:16px;transition:all .2s;flex-shrink:0}
.expand-btn:hover{background:rgba(201,162,39,0.15);border-color:var(--gold)}
.recent-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.archive-section{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;position:sticky;top:70px}
.year-group{margin-bottom:14px}
.year-label{font-family:'Teko',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(201,184,163,0.06);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.year-label:hover{color:var(--gold-hi)}
.year-arrow{font-size:10px;transition:transform .2s}
.year-arrow.collapsed{transform:rotate(-90deg)}
.champ-tag{font-family:'Teko',sans-serif;font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin:6px 0 3px 2px}
.archive-item{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;margin-bottom:2px;border:1px solid transparent;transition:all .15s;text-decoration:none;color:var(--text)}
.archive-item:hover{background:rgba(201,162,39,0.04);border-color:rgba(201,162,39,0.12)}
.ai-info{flex:1;min-width:0}
.ai-title{font-family:'Teko',sans-serif;font-size:12px;letter-spacing:0.3px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-date{font-size:9px;color:var(--dim);margin-top:1px}
.ai-badges{display:flex;gap:2px;margin-top:2px}
.ai-badges span{font-size:7px;padding:1px 5px;border-radius:6px}
.ai-expand{width:22px;height:22px;border-radius:4px;background:rgba(7,7,15,0.5);border:1px solid rgba(201,162,39,0.15);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:10px;opacity:0;transition:opacity .15s;flex-shrink:0}
.archive-item:hover .ai-expand{opacity:1}
.loading{text-align:center;padding:40px;color:var(--dim);font-family:'Teko',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase}
.empty{text-align:center;padding:60px 20px;font-family:'Teko',sans-serif;font-size:14px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.empty-icon{font-size:40px;margin-bottom:12px;display:block}

/* FULLSCREEN LIGHTBOX */
.lightbox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.94);backdrop-filter:blur(12px);z-index:10000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:visibility 0.25s, opacity 0.25s;cursor:pointer}
.lightbox.open{visibility:visible;opacity:1}
.lightbox-content{max-width:90vw;max-height:90vh;position:relative;cursor:default}
.lightbox-img{max-width:100%;max-height:90vh;display:block;margin:0 auto;border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,0.6);border:1px solid rgba(201,162,39,0.4)}
.lightbox-caption{position:absolute;bottom:-36px;left:0;right:0;text-align:center;font-family:'Teko',sans-serif;font-size:15px;letter-spacing:1px;color:var(--gold-hi);background:rgba(7,7,15,0.8);padding:8px 16px;border-radius:40px;display:inline-block;width:auto;margin:0 auto;backdrop-filter:blur(6px)}
.lightbox-close{position:absolute;top:20px;right:30px;font-size:32px;color:var(--gold-hi);background:rgba(0,0,0,0.6);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;border:1px solid rgba(201,162,39,0.3)}
.lightbox-close:hover{background:rgba(201,162,39,0.25);transform:scale(1.05);color:#fff}
@media(max-width:880px){
  .social-layout{grid-template-columns:1fr}
  .side-col{order:-1}
  .archive-section{position:static}
}
@media(max-width:550px){
  .recent-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="page-hero" style="position:relative">
  <div style="position:absolute;top:0;right:20px;display:flex;gap:8px;align-items:center;">
    <a href="https://www.tiktok.com/@antocooper6" target="_blank" rel="noopener" style="width:44px;height:44px;border-radius:50%;background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.2);display:flex;align-items:center;justify-content:center;transition:all 0.2s;text-decoration:none" onmouseover="this.style.background='rgba(0,0,0,0.3)';this.style.borderColor='rgba(255,255,255,0.4)'" onmouseout="this.style.background='rgba(201,162,39,0.08)';this.style.borderColor='rgba(201,162,39,0.2)'">

  </div>
  <h1 class="page-title">Social</h1>
  <p class="page-sub">Post &middot; Foto &middot; Video &middot; Storie</p>

<div class="social-layout">
  <div class="main-col" id="mainCol">
    <div class="loading" id="loadingMsg">Caricamento...</div>
  </div>
  <div class="side-col" id="sideCol"></div>
</div>

<!-- LIGHTBOX MODAL -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <img id="lightboxImg" class="lightbox-img" src="" alt="">
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>
  <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
</div>

<script>
// CONFIGURAZIONE - usa raw.githubusercontent.com diretto
var RAW = 'https://raw.githubusercontent.com/mz4466/etna-racing-club/main';
var socialIndex = [];

// Funzione fetch con timeout e retry
async function fetchWithTimeout(url, timeout = 8000) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(id);
    return response;
  } catch (err) {
    clearTimeout(id);
    throw err;
  }
}

async function fetchJSONSafe(path) {
  // Prova prima raw.githubusercontent
  var rawUrl = RAW + '/' + path;
  try {
    var res = await fetchWithTimeout(rawUrl + '?_=' + Date.now());
    if (res.ok) {
      return await res.json();
    }
  } catch(e) { console.warn('raw failed', e); }
  
  // Fallback: GitHub API (richiede CORS ma funziona su molti ambienti)
  try {
    var apiUrl = 'https://api.github.com/repos/mz4466/etna-racing-club/contents/' + path + '?ref=main';
    var apiRes = await fetchWithTimeout(apiUrl + '&_=' + Date.now());
    if (apiRes.ok) {
      var meta = await apiRes.json();
      if (meta.content) {
        var decoded = atob(meta.content.replace(/\s/g, ''));
        return JSON.parse(decodeURIComponent(escape(decoded)));
      }
    }
  } catch(e) { console.warn('API fallback failed', e); }
  
  // Secondo fallback: prova con jsdelivr CDN
  try {
    var cdnUrl = 'https://cdn.jsdelivr.net/gh/mz4466/etna-racing-club@main/' + path;
    var cdnRes = await fetchWithTimeout(cdnUrl + '?_=' + Date.now());
    if (cdnRes.ok) {
      return await cdnRes.json();
    }
  } catch(e) {}
  
  return null;
}

function countTypes(types){
  if(!types || !types.length) return [];
  var counts = {};
  types.forEach(function(t){ counts[t] = (counts[t]||0)+1; });
  var result = [];
  var labels = { title:'titolo', photo:'foto', video:'video', text:'testo', audio:'audio', notes:'note' };
  var order = ['photo','video','text','audio','notes'];
  order.forEach(function(t){
    if(counts[t]){
      var label = labels[t] || t;
      if(counts[t] > 1) label = counts[t] + ' ' + label;
      result.push({type:t, label:label});
    }
  });
  return result;
}

function badgeClass(type){
  var map = { title:'pb-title', photo:'pb-photo', video:'pb-video', text:'pb-text', audio:'pb-audio', notes:'pb-notes' };
  return map[type] || 'pb-text';
}

function formatDate(dateStr){
  if(!dateStr) return '';
  var parts = dateStr.split('-');
  if(parts.length < 3) return dateStr;
  var months = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var d = parseInt(parts[2],10);
  var m = parseInt(parts[1],10)-1;
  return d + ' ' + months[m] + ' ' + parts[0];
}

function postUrl(slug){
  return 'social/posts/' + slug + '.html';
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// Lightbox functions
function openLightbox(imageUrl, caption) {
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lightboxImg');
  var cap = document.getElementById('lightboxCaption');
  if (!imageUrl) return;
  img.src = imageUrl;
  cap.textContent = caption || '';
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  var lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(function() {
    var img = document.getElementById('lightboxImg');
    if(img && !lb.classList.contains('open')) img.src = '';
  }, 300);
}

// Carica indice e renderizza
async function init() {
  var loadingMsg = document.getElementById('loadingMsg');
  try {
    var idx = await fetchJSONSafe('social/index.json');
    if(!idx || !Array.isArray(idx) || idx.length === 0) {
      loadingMsg.innerHTML = '<span class="empty-icon">📭</span>Nessun post disponibile<br><span style="font-size:10px">Connettiti con GitHub tramite gestisci_social.html</span>';
      return;
    }
    socialIndex = idx.slice().sort(function(a,b){
      return (b.date||'').localeCompare(a.date||'');
    });
    loadingMsg.style.display = 'none';
    renderMain();
    renderArchive();
  } catch(err) {
    console.error(err);
    loadingMsg.innerHTML = '<span class="empty-icon">⚠️</span>Errore caricamento<br><span style="font-size:10px">Verifica connessione o repository</span>';
  }
}

function renderMain() {
  var col = document.getElementById('mainCol');
  var html = '';
  
  // Post in evidenza (ultimo)
  if(socialIndex.length > 0) {
    var p = socialIndex[0];
    var types = countTypes(p.blockTypes);
    html += '<div><div class="badge-latest">⭐ Ultimo Post</div>';
    html += '<a href="'+postUrl(p.slug)+'" class="post-card">';
    html += '<div class="post-card-body">';
    html += '<div class="post-card-info">';
    html += '<div class="post-card-title big">'+esc(p.title)+'</div>';
    html += '<div class="post-card-meta">';
    if(p.campionato) html += '<span>'+esc(p.campionato)+'</span>';
    html += '<span>'+formatDate(p.date)+'</span></div>';
    html += '<div class="post-badges">';
    types.forEach(function(t){ html += '<span class="post-badge '+badgeClass(t.type)+'">'+esc(t.label)+'</span>'; });
    html += '</div></div>';
    html += '<div class="expand-btn">↗</div>';
    html += '</div></a></div>';
  }
  
  // 2 successivi
  if(socialIndex.length > 1) {
    html += '<div><div class="section-label">Post Recenti</div>';
    html += '<div class="recent-row">';
    var limit = Math.min(3, socialIndex.length);
    for(var i=1; i<limit; i++) {
      var p = socialIndex[i];
      var types = countTypes(p.blockTypes);
      html += '<a href="'+postUrl(p.slug)+'" class="post-card">';
      html += '<div class="post-card-body">';
      html += '<div class="post-card-info">';
      html += '<div class="post-card-title">'+esc(p.title)+'</div>';
      html += '<div class="post-card-meta"><span>'+formatDate(p.date)+'</span></div>';
      html += '<div class="post-badges">';
      types.forEach(function(t){ html += '<span class="post-badge '+badgeClass(t.type)+'">'+esc(t.label)+'</span>'; });
      html += '</div></div>';
      html += '<div class="expand-btn" style="width:28px;height:28px;font-size:13px">↗</div>';
      html += '</div></a>';
    }
    html += '</div></div>';
  }
  
  // Tutti i post rimanenti
  if(socialIndex.length > 3) {
    html += '<div><div class="section-label">Tutti i Post</div>';
    for(var i=3; i<socialIndex.length; i++) {
      var p = socialIndex[i];
      var types = countTypes(p.blockTypes);
      html += '<a href="'+postUrl(p.slug)+'" class="post-card" style="margin-bottom:8px">';
      html += '<div class="post-card-body" style="padding:10px 14px">';
      html += '<div class="post-card-info">';
      html += '<div class="post-card-title" style="font-size:15px">'+esc(p.title)+'</div>';
      html += '<div class="post-card-meta"><span>'+formatDate(p.date)+'</span>';
      if(p.campionato) html += '<span>'+esc(p.campionato)+'</span>';
      html += '</div>';
      html += '<div class="post-badges">';
      types.forEach(function(t){ html += '<span class="post-badge '+badgeClass(t.type)+'">'+esc(t.label)+'</span>'; });
      html += '</div></div>';
      html += '<div class="expand-btn" style="width:26px;height:26px;font-size:12px">↗</div>';
      html += '</div></a>';
    }
    html += '</div>';
  }
  
  if(html === '') html = '<div class="empty"><span class="empty-icon">📭</span>Nessun post disponibile</div>';
  col.innerHTML = html;
}

function renderArchive() {
  var side = document.getElementById('sideCol');
  var byYear = {};
  socialIndex.forEach(function(p){
    var y = p.year || 'Altro';
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(p);
  });
  var years = Object.keys(byYear).sort(function(a,b){ return b-a; });
  
  var html = '<div class="archive-section">';
  html += '<div class="section-label">Archivio</div>';
  
  years.forEach(function(y){
    html += '<div class="year-group">';
    html += '<div class="year-label" onclick="toggleYear(this)">'+esc(y)+'<span class="year-arrow">▼</span></div>';
    html += '<div class="year-content">';
    
    var byChamp = {};
    byYear[y].forEach(function(p){
      var c = p.campionato || '';
      if(!byChamp[c]) byChamp[c] = [];
      byChamp[c].push(p);
    });
    
    Object.keys(byChamp).forEach(function(c){
      if(c) html += '<div class="champ-tag">'+esc(c)+'</div>';
      byChamp[c].forEach(function(p){
        var types = countTypes(p.blockTypes);
        html += '<a href="'+postUrl(p.slug)+'" class="archive-item">';
        html += '<div class="ai-info">';
        html += '<div class="ai-title">'+esc(p.title)+'</div>';
        html += '<div class="ai-date">'+formatDate(p.date)+'</div>';
        html += '<div class="ai-badges">';
        types.forEach(function(t){
          html += '<span class="post-badge '+badgeClass(t.type)+'" style="font-size:7px;padding:1px 4px">'+esc(t.label)+'</span>';
        });
        html += '</div></div>';
        html += '<div class="ai-expand">↗</div>';
        html += '</a>';
      });
    });
    html += '</div></div>';
  });
  html += '</div>';
  side.innerHTML = html;
}

window.toggleYear = function(el) {
  var content = el.nextElementSibling;
  var arrow = el.querySelector('.year-arrow');
  if(content.style.display === 'none') {
    content.style.display = '';
    if(arrow) arrow.classList.remove('collapsed');
  } else {
    content.style.display = 'none';
    if(arrow) arrow.classList.add('collapsed');
  }
};

// Avvio
init();

// ============================================
// GLOBAL LIGHTBOX PER QUALSIASI IMMAGINE NEI POST (funziona anche dopo caricamento dinamico)
// ============================================
// Aggiungo un listener globale che intercetta click su immagini
document.addEventListener('click', function(e) {
  var target = e.target;
  // Se l'immagine è dentro un link? evita doppio effetto, ma vogliamo lightbox anche se dentro <a>
  if(target.tagName === 'IMG') {
    // Evita se è già nel lightbox o se è un'icona minuscola
    if(target.closest('.lightbox')) return;
    var imgSrc = target.src;
    if(imgSrc && (imgSrc.startsWith('http') || imgSrc.startsWith('social/') || imgSrc.startsWith('../media/'))) {
      e.preventDefault();
      e.stopPropagation();
      var caption = target.alt || target.title || '';
      // cerca eventuale didascalia nel parent prossimo
      var parentFig = target.closest('.cb-p, .bc-photo, .block-photo');
      if(parentFig) {
        var capElem = parentFig.querySelector('.photo-caption');
        if(capElem) caption = capElem.innerText;
      }
      openLightbox(imgSrc, caption);
      return false;
    }
  }
});

// Supporto anche per immagini caricate dinamicamente tramite AJAX (es. se carichi post con fetch)
// Usa MutationObserver per intercettare nuove immagini
const observer = new MutationObserver(function(mutations) {
  mutations.forEach(function(mut) {
    if(mut.addedNodes.length) {
      // le immagini già verranno catturate dal click handler globale
    }
  });
});
observer.observe(document.body, { childList: true, subtree: true });

// Se la pagina viene visualizzata dentro un iframe o con hash, mantieni funzionante

</script>
