<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distintivi Pilota - Etna Racing Club</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300,400,500,600,700&family=Russo+One&family=Roboto:wght@300,400,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070a; --card:#121318; --accent:#ff5014; --accent2:#ff8c42; --muted:#c9b8a3; --cream:#fff5e6;
    --gold:#c9a227; --gold2:#e8c547; --line:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Roboto',sans-serif; background:linear-gradient(180deg,#020203 0%,#0b0b0d 60%); color:var(--cream); min-height:100vh; }
  a{color:inherit;}
  header{ padding:28px; display:flex; align-items:center; justify-content:space-between; gap:20px; max-width:1200px; margin:0 auto; }
  header .brand{ display:flex; gap:18px; align-items:center; }
  header .brand img{ width:56px; height:auto; border-radius:8px; box-shadow:0 6px 18px rgba(255,80,20,0.2); }
  header h1{ font-family:'Russo One',sans-serif; font-size:24px; margin:0; letter-spacing:2px; color:var(--accent2); }
  .back-link{ font-family:'Teko',sans-serif; font-size:16px; letter-spacing:1px; text-decoration:none; color:var(--muted); border:1px solid var(--line); padding:8px 16px; border-radius:20px; transition:all .2s; }
  .back-link:hover{ color:var(--cream); border-color:rgba(255,80,20,0.4); }

  .container{ max-width:1080px; margin:0 auto; padding:0 20px 80px; }

  .profile{
    display:flex; gap:22px; align-items:center; padding:20px; border-radius:20px;
    background:linear-gradient(180deg,rgba(18,19,24,0.95),rgba(8,8,10,0.96));
    border:1px solid var(--line); margin-bottom:36px;
  }
  .profile img{ width:96px; height:96px; border-radius:14px; object-fit:cover; flex-shrink:0; box-shadow:0 6px 18px rgba(0,0,0,0.4); }
  .profile .fallback{ width:96px; height:96px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,#0d0d1a,#1a1a2e); display:flex; align-items:center; justify-content:center; font-size:36px; opacity:.4; }
  .profile-name{ font-family:'Teko',sans-serif; font-size:34px; letter-spacing:1px; line-height:1; margin:0 0 4px; }
  .profile-psn{ color:var(--gold); font-size:15px; font-family:'Teko',sans-serif; letter-spacing:1px; }
  .profile-sub{ color:var(--muted); font-size:13px; margin-top:6px; }

  .state{ text-align:center; color:var(--muted); padding:60px 20px; font-family:'Teko',sans-serif; font-size:20px; letter-spacing:1px; }

  .section{ margin-top:34px; }
  .section-head{ display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:20px; }
  .section-head .n{ color:var(--accent); font-family:'Teko',sans-serif; font-size:17px; font-weight:600; }
  .section-head h2{ font-family:'Russo One',sans-serif; font-size:16px; margin:0; color:var(--cream); letter-spacing:0.5px; }
  .section-head .sub{ color:var(--muted); font-size:12px; margin-left:auto; }

  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
  .card-top{ display:flex; align-items:center; gap:12px; }
  .card h3{ font-family:'Teko',sans-serif; font-size:22px; margin:0; color:var(--cream); letter-spacing:0.5px; font-weight:500; }
  .card .desc{ color:var(--muted); font-size:12px; line-height:1.4; margin:0; }

  .ring-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ring-wrap svg{ display:block; transform:rotate(-90deg); }
  .ring-wrap .ring-track{ stroke:rgba(255,255,255,0.08); }
  .ring-wrap .ring-fg{ stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
  .ring-wrap .ring-label{ position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%,#26232a,#0d0c0e 75%); font-family:'Teko',sans-serif; font-weight:600;
    box-shadow:0 0 10px rgba(0,0,0,0.4); }
  .ring-wrap.platino{ animation:pulseGlow 2.4s ease-in-out infinite; }
  @keyframes pulseGlow{
    0%,100%{ filter:drop-shadow(0 0 4px rgba(255,140,66,0.3)); }
    50%{ filter:drop-shadow(0 0 16px rgba(255,140,66,0.65)); }
  }

  .tiers{ display:flex; gap:6px; flex-wrap:wrap; }
  .tier-dot{ width:18px; height:18px; clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); background:rgba(255,255,255,0.08); }
  .tier-dot.bronzo{ background:linear-gradient(160deg,#c98a4d,#8a5426); }
  .tier-dot.argento{ background:linear-gradient(160deg,#e7e4db,#9d9a91); }
  .tier-dot.oro{ background:linear-gradient(160deg,var(--gold2),var(--gold)); }
  .tier-dot.platino{ background:linear-gradient(160deg,#ffd8ad,var(--accent2)); box-shadow:0 0 8px rgba(255,140,66,0.5); }

  .stat-line{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-family:'Teko',sans-serif; letter-spacing:0.5px; }
  .stat-line b{ color:var(--gold2); font-weight:600; font-size:13px; }
  .progress{ height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
  .progress > div{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }

  .card.locked{ opacity:0.55; }
  .card.locked h3{ color:var(--muted); }
  .manual-tag{ align-self:flex-start; font-family:'Teko',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:2px 10px; border-radius:20px; }
  .manual-tag.assegnato{ background:rgba(255,140,66,0.15); color:var(--accent2); border:1px solid rgba(255,140,66,0.35); }
  .manual-tag.non-assegnato{ background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--line); }

  .cat-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .cat-chip{ font-family:'Teko',sans-serif; font-size:11px; letter-spacing:0.5px; padding:2px 8px; border-radius:10px;
    background:rgba(255,255,255,0.04); color:var(--muted); border:1px solid var(--line); opacity:0.6; }
  .cat-chip.got{ background:rgba(201,162,39,0.15); color:var(--gold2); border:1px solid rgba(201,162,39,0.4); opacity:1; }

  footer{ text-align:center; color:var(--muted); font-size:11px; margin-top:50px; padding-top:20px; border-top:1px solid var(--line); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="etna-logo.jpg" alt="ERC" onerror="this.style.display='none'">
    <h1>Distintivi Pilota</h1>
  </div>
  <a class="back-link" href="piloti_gt7.html">&larr; Torna ai Piloti</a>
</header>

<div class="container">
  <div id="root"><div class="state">Caricamento dati pilota...</div></div>
</div>

<script>
const BASE_RAW = 'https://raw.githubusercontent.com/mz4466/etna-racing-club/main';

const params = new URLSearchParams(location.search);
const qPsn  = (params.get('psn')  || '').toLowerCase().trim();
const qNome = (params.get('nome') || '').toLowerCase().trim();

const root = document.getElementById('root');

function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

async function fetchBatched(urls, fetchFn, batchSize, delayMs){
  var results = [];
  for (var i = 0; i < urls.length; i += batchSize) {
    var batch = urls.slice(i, i + batchSize);
    var batchResults = await Promise.all(batch.map(fetchFn));
    results = results.concat(batchResults);
    if (i + batchSize < urls.length) await new Promise(function(r){ setTimeout(r, delayMs); });
  }
  return results;
}

function daysBetween(d1, d2){ return Math.abs(d2 - d1) / 86400000; }

// Somma i periodi in cui il pilota è stato "Attivo", ignorando i gap "Non Attivo".
// Modello dati (pilot.json):
//   dataIscrizione: "YYYY-MM-DD"           -> da qui il pilota è considerato Attivo
//   statusHistory: [{date, attivo}, ...]   -> cambi di stato successivi, in ordine cronologico
// Se questi campi non sono ancora stati impostati per un pilota (dati storici),
// si ricade sul comportamento precedente: anni dalla prima gara disputata,
// contati per intero se il pilota è attualmente attivo.
function computeVeteranoAnni(pilot, earliestRaceDate){
  var joinDateStr = pilot.dataIscrizione || null;
  var history = Array.isArray(pilot.statusHistory)
    ? pilot.statusHistory.filter(function(h){ return h && h.date; }).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); })
    : [];

  if (!joinDateStr) {
    // Nessuna Data Iscrizione impostata -> fallback al vecchio comportamento
    if (!earliestRaceDate) return 0;
    if (pilot.attivo === false) return 0; // non sappiamo da quando è inattivo, meglio non sovrastimare
    return Math.floor(daysBetween(new Date(earliestRaceDate), new Date()) / 365.25);
  }

  var segments = [{ date: joinDateStr, attivo: true }].concat(history);
  var totalDays = 0;
  var today = new Date();
  for (var i = 0; i < segments.length; i++) {
    var start = new Date(segments[i].date);
    var end = (i + 1 < segments.length) ? new Date(segments[i + 1].date) : today;
    if (segments[i].attivo !== false && end > start) {
      totalDays += daysBetween(start, end);
    }
  }
  return Math.floor(totalDays / 365.25);
}
function initials(name){ return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase(); }

// Elenco canonico "Categoria Auto" — deve rispecchiare le option in crea/modifica-campionato.html
const CATEGORIA_AUTO_LIST = ['Gr1','Gr2','Gr3','Gr4','Monoposto','Sportive Stradali','Storiche','Super Turismo','Kart','City Car','Rally','Ultraleggere'];

function renderCatAutoChips(achievedSet){
  var chips = CATEGORIA_AUTO_LIST.map(function(c){
    var got = !!achievedSet[c.toLowerCase().trim()];
    return '<span class="cat-chip' + (got ? ' got' : '') + '">' + (got ? '✓ ' : '') + esc(c) + '</span>';
  }).join('');
  return '<div class="cat-chips">' + chips + '</div>';
}

// ============================================================
// CATALOGO DISTINTIVI — rispecchia esattamente la tabella fornita
// type: 'tiered' (bronzo/argento/oro/platino, calcolato)
//       'auto'   (unica, calcolata automaticamente)
//       'manual' (unica, assegnata a mano via pilot.badges[])
// ============================================================
const CATALOG = [
  { cat:'Anzianità nel Club', items:[
    { key:'veterano',  nome:'Veterano',  desc:'Sale ogni anno',        type:'tiered', thresholds:[1,2,3,5], unit:'anni' },
  ]},
  { cat:'Partecipazione Gare', items:[
    { key:'gare',            nome:'Habitué di Pista',   desc:'Gare Totali Corse',           type:'tiered', thresholds:[10,30,60,100], unit:'gare' },
    { key:'costanza',        nome:'Costanza',           desc:'Gare Consecutive',            type:'tiered', thresholds:[3,8,15,25], unit:'gare' },
    { key:'presenzaPerfetta',nome:'Presenza Perfetta',  desc:'100% Presenze in Campagna',    type:'tiered', thresholds:[1,2,3,5], unit:'campagne' },
    { key:'globetrotter',    nome:'Globetrotter',       desc:'Circuiti Diversi Corsi',       type:'tiered', thresholds:[10,16,22,30], unit:'circuiti' },
  ]},
  { cat:'Campionati', items:[
    { key:'campCompletati', nome:'Camp. Completati', desc:'Campionati Completati', type:'tiered', thresholds:[1,5,10,20], unit:'campionati' },
    { key:'campVinti',      nome:'Camp. Vinti',      desc:'Campionati Vinti',      type:'tiered', thresholds:[1,3,6,10], unit:'titoli' },
  ]},
  { cat:'Eventi & Trofei', items:[
    { key:'eventi',     nome:'Cacciatore di Eventi/Trofei', desc:'N° di Partecipazioni', type:'tiered', thresholds:[1,3,5,10], unit:'eventi' },
    { key:'trofeiVinti',nome:'Collezionista di Eventi/Trofei', desc:'Eventi/Trofei Vinti',  type:'tiered', thresholds:[1,2,3,5], unit:'trofei' },
  ]},
  { cat:'Risultati', items:[
    { key:'vittorie',   nome:'Vittorie',    desc:'Numero di Vittorie',          type:'tiered', thresholds:[1,3,5,8], unit:'vittorie' },
    { key:'podi',       nome:'Podi',        desc:'Podi Totali',                 type:'tiered', thresholds:[1,5,10,20], unit:'podi' },
    { key:'giroveloce', nome:'Giri Veloci', desc:'Giri Veloci Ottenuti',        type:'tiered', thresholds:[1,4,8,15], unit:'giri veloci' },
    { key:'pole',       nome:'Poleman',     desc:'Pole Position',               type:'tiered', thresholds:[1,3,6,10], unit:'pole' },
    { key:'grandSlam',  nome:'Grand Slam',  desc:'Vittoria+Pole+Giro Veloce',   type:'tiered', thresholds:[1,2,3,5], unit:'grand slam' },
  ]},
  { cat:'Speciali', items:[
    { key:'primaVittoriaPersonale', nome:'1ª Vittoria',            desc:'Per chi ha vinto almeno 1 Gara',    type:'auto' },
    { key:'pilota-stagione',        nome:'Pilota della Stagione',  desc:'Miglior pilota della stagione',     type:'manual' },
    { key:'pilota-anno',            nome:'Pilota dell\'Anno',      desc:'Miglior pilota dell\'anno',         type:'manual' },
    { key:'sfortunato',             nome:'Sfortunato',             desc:'N° di Dnf',                          type:'tiered', thresholds:[1,3,5,10], unit:'dnf' },
    { key:'fair-play',              nome:'Fair Play',              desc:'Nessuna penalità stagionale',        type:'manual' },
    { key:'rookie-stagione',        nome:'Rookie della Stagione',  desc:'Miglior esordiente stagionale',     type:'manual' },
    { key:'rookie-anno',            nome:'Rookie dell\'Anno',      desc:'Miglior esordiente annuale',        type:'manual' },
    { key:'multicat',               nome:'Multi-Categoria',        desc:'Classi Diverse Corse',               type:'tiered', thresholds:[3,6,9,12], unit:'categorie' },
  ]},
];

const TIER_NAMES  = ['locked','bronzo','argento','oro','platino'];
const TIER_COLORS = { locked:'rgba(255,255,255,0.15)', bronzo:'#c98a4d', argento:'#c9c6bd', oro:'#e8c547', platino:'#ff8c42' };

function tierFor(value, thresholds){
  var t = 0;
  for (var i = 0; i < thresholds.length; i++) if (value >= thresholds[i]) t = i + 1;
  return t;
}

// Real circular progress ring (SVG)
function ringMedal(percent, tierName, label, size){
  size = size || 56;
  var stroke = Math.max(4, Math.round(size * 0.09));
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var pct = Math.max(0, Math.min(100, percent));
  var offset = c - (c * pct / 100);
  var color = TIER_COLORS[tierName] || TIER_COLORS.locked;
  var labelSize = size - stroke * 2 - 6;
  var fontSize = Math.round(size * 0.27);
  return ''
    + '<div class="ring-wrap' + (tierName === 'platino' ? ' platino' : '') + '" style="width:' + size + 'px;height:' + size + 'px;">'
    +   '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    +     '<circle class="ring-track" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="' + stroke + '"/>'
    +     '<circle class="ring-fg" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"/>'
    +   '</svg>'
    +   '<div class="ring-label" style="width:' + labelSize + 'px;height:' + labelSize + 'px;font-size:' + fontSize + 'px;color:' + color + ';">' + label + '</div>'
    + '</div>';
}

function renderTieredCard(def, value, extraHtml){
  var tier = tierFor(value, def.thresholds);
  var tierName = TIER_NAMES[tier];
  var nextThreshold = def.thresholds[tier];
  var progressPct = 100;
  var nextLabel = 'Livello massimo raggiunto';
  if (nextThreshold !== undefined) {
    var prevThreshold = tier > 0 ? def.thresholds[tier - 1] : 0;
    progressPct = Math.max(4, Math.min(100, Math.round(((value - prevThreshold) / (nextThreshold - prevThreshold)) * 100)));
    nextLabel = 'Prossimo: ' + nextThreshold + ' ' + def.unit;
  }
  var tiersHtml = def.thresholds.map(function(th, i){
    var cls = value >= th ? TIER_NAMES[i+1] : '';
    return '<div class="tier-dot ' + cls + '" title="' + th + ' ' + esc(def.unit) + '"></div>';
  }).join('');

  return ''
    + '<div class="card">'
    +   '<div class="card-top">' + ringMedal(progressPct, tierName, initials(def.nome), 56) + '<div><h3>' + esc(def.nome) + '</h3></div></div>'
    +   '<p class="desc">' + esc(def.desc) + '</p>'
    +   (extraHtml || '')
    +   '<div class="tiers">' + tiersHtml + '</div>'
    +   '<div class="stat-line"><span>' + nextLabel + '</span><b>' + value + ' ' + esc(def.unit) + '</b></div>'
    +   '<div class="progress"><div style="width:' + progressPct + '%"></div></div>'
    + '</div>';
}

function renderUnicaCard(def, unlocked){
  var tierName = unlocked ? 'platino' : 'locked';
  var tagCls = unlocked ? 'assegnato' : 'non-assegnato';
  var tagTxt = unlocked ? 'Ottenuto' : 'Non ottenuto';
  return ''
    + '<div class="card' + (unlocked ? '' : ' locked') + '">'
    +   '<div class="card-top">' + ringMedal(unlocked ? 100 : 0, tierName, initials(def.nome), 56) + '<div><h3>' + esc(def.nome) + '</h3></div></div>'
    +   '<p class="desc">' + esc(def.desc) + '</p>'
    +   '<span class="manual-tag ' + tagCls + '">' + tagTxt + '</span>'
    + '</div>';
}

async function main(){
  if (!qPsn && !qNome) {
    root.innerHTML = '<div class="state">Nessun pilota specificato.<br>Apri questa pagina da un profilo pilota su <a href="piloti_gt7.html">Piloti GT7</a>.</div>';
    return;
  }

  try {
    // ---- 1. Trova la scheda del pilota (nome/foto/badges manuali) ----
    var idxRes = await fetch(BASE_RAW + '/piloti_schede/index.json?_=' + Date.now());
    var pilotFiles = idxRes.ok ? await idxRes.json() : [];
    pilotFiles = (pilotFiles || []).filter(function(n){ return n.endsWith('.json') && n !== 'psn-map.json' && n !== 'index.json'; });

    var pilotDocs = await fetchBatched(pilotFiles, async function(name){
      try { var r = await fetch(BASE_RAW + '/piloti_schede/' + name); if(!r.ok) return null; return await r.json(); }
      catch(e){ return null; }
    }, 5, 250);

    var pilot = pilotDocs.filter(Boolean).find(function(p){
      var pPsn  = (p.psn  || '').toLowerCase().trim();
      var pNome = (p.nome || p.name || '').toLowerCase().trim();
      return (qPsn && pPsn === qPsn) || (qNome && pNome === qNome);
    });

    if (!pilot) {
      root.innerHTML = '<div class="state">Pilota non trovato.<br>Controlla il link o torna a <a href="piloti_gt7.html">Piloti GT7</a>.</div>';
      return;
    }

    var targetPsn  = (pilot.psn || '').toLowerCase().trim();
    var targetNome = (pilot.nome || pilot.name || '').toLowerCase().trim();

    // ---- 2. Calendario + risultati ----
    var calendario = [];
    try { var calRes = await fetch(BASE_RAW + '/calendario.json?_=' + Date.now()); if (calRes.ok) calendario = await calRes.json(); } catch(e){}

    var rIndexRes = await fetch(BASE_RAW + '/risultati/index.json?_=' + Date.now());
    var raceFiles = rIndexRes.ok ? await rIndexRes.json() : [];
    raceFiles = (raceFiles || []).filter(function(n){ return n.endsWith('.json'); });

    var races = await fetchBatched(raceFiles, async function(name){
      try { var r = await fetch(BASE_RAW + '/risultati/' + name); if(!r.ok) return null; return await r.json(); }
      catch(e){ return null; }
    }, 5, 250);
    races = races.filter(function(r){ return r && Array.isArray(r.rows); });

    var ufficioseIds = {};
    calendario.forEach(function(c){ if (c.cat === 'Gara Ufficiosa' && c.id) ufficioseIds[c.id] = true; });

    // PSN resolution (stesso pattern usato in tutto il sito)
    var psnByNameInChamp = {}, psnByNameGlobal = {};
    races.forEach(function(race){
      var cid = race.champId || '';
      (race.rows || []).forEach(function(row){
        if (!row.nome) return;
        var nk = row.nome.toLowerCase().trim();
        var ps = (row.psn || '').toLowerCase().trim();
        if (!ps) return;
        if (cid) { if (!psnByNameInChamp[cid]) psnByNameInChamp[cid] = {}; psnByNameInChamp[cid][nk] = ps; }
        psnByNameGlobal[nk] = ps;
      });
    });
    function resolvePsn(champId, nome){
      var nk = (nome || '').toLowerCase().trim();
      if (!nk) return '';
      if (champId && psnByNameInChamp[champId] && psnByNameInChamp[champId][nk]) return psnByNameInChamp[champId][nk];
      if (psnByNameGlobal[nk]) return psnByNameGlobal[nk];
      return '';
    }
    function isTarget(rowNome, rowPsn){
      var ps = (rowPsn || '').toLowerCase().trim();
      var nm = (rowNome || '').toLowerCase().trim();
      if (targetPsn && ps === targetPsn) return true;
      if (!ps && targetNome && nm === targetNome) return true;
      if (targetPsn && !ps && nm === targetNome) return true;
      return false;
    }

    var stats = {
      veterano:0, gare:0, costanza:0, presenzaPerfetta:0, globetrotter:0,
      campCompletati:0, campVinti:0, eventi:0, trofeiVinti:0,
      vittorie:0, podi:0, giroveloce:0, pole:0, grandSlam:0,
      sfortunato:0, multicat:0
    };
    var champParticipated = {};    // champId -> earliest date
    var raceLog = [];              // { date, stato }
    var circuitiSet = {};
    var categorieSet = {};
    var champRounds = {};          // champId -> Set(garaNum) partecipati dal target
    var champTotalRounds = {};     // champId -> totalRounds (da calendario, o garaTot come fallback)

    races.forEach(function(race){
      var champId = race.champId || '';
      if (champId && ufficioseIds[champId]) return;

      var champ = null;
      if (champId) champ = calendario.find(function(c){ return c.id === champId; }) || null;
      if (!champ && race.champIdx !== undefined) { var idx = parseInt(race.champIdx); if(!isNaN(idx)) champ = calendario[idx] || null; }

      var garaNum = parseInt(race.garaNum) || 0;
      var garaTot = parseInt(race.garaTot) || 0;
      var isFinal = garaNum > 0 && garaNum === garaTot;
      var totalRounds = (champ && champ.totalRounds) ? parseInt(champ.totalRounds) : garaTot;

      (race.rows || []).forEach(function(row){
        if (!isTarget(row.nome, row.psn)) return;
        stats.gare++;
        var pos = parseInt(row.pos);
        if (pos === 1) stats.vittorie++;
        if (pos >= 1 && pos <= 3) stats.podi++;
        if (row.fl === true) stats.giroveloce++;
        if (row.pole === true) stats.pole++;
        if (pos === 1 && row.fl === true && row.pole === true) stats.grandSlam++;
        if (champ && (champ.cat === 'Evento' || champ.cat === 'Trofeo')) stats.eventi++;
        if (row.stato === 'dnf') stats.sfortunato++;

        var circuito = race.circuito || race.circuit || race.track || '';
        if (circuito) circuitiSet[circuito.toLowerCase().trim()] = true;
        if (champ && champ.catAuto) categorieSet[String(champ.catAuto).toLowerCase().trim()] = true;

        raceLog.push({ date: race.data || '', stato: row.stato || 'ok' });

        if (champId) {
          var d = race.data || '9999';
          if (!champParticipated[champId] || d < champParticipated[champId]) champParticipated[champId] = d;
          if (!champRounds[champId]) champRounds[champId] = {};
          champRounds[champId][garaNum] = true;
          champTotalRounds[champId] = totalRounds;
        }
      });

      // Vittoria di campionato/trofeo, basata sulla classifica finale
      if (isFinal && champ && champ.trophy) {
        var standings = race.standings || [];
        var champion = standings.find(function(s){ return parseInt(s.pos) === 1; });
        if (!champion && race.rows && race.rows.length) champion = { nome: race.rows[0].nome };
        if (champion && champion.nome) {
          var champPsn = resolvePsn(champId, champion.nome) || champion.nome.toLowerCase().trim();
          var won = champPsn === targetPsn || (!targetPsn && champion.nome.toLowerCase().trim() === targetNome);
          if (won) {
            if (champ.cat === 'Trofeo' || champ.cat === 'Evento') stats.trofeiVinti++;
            else stats.campVinti++;
          }
        }
      }
    });

    // Camp. Completati: un campionato conta come "completato" se il pilota ha
    // corso almeno il numero minimo di gare richiesto — quel minimo è il
    // "Migliore su… gare" (bestOf) del campionato, se impostato; se non è
    // impostato nessun minimo, serve averle corse TUTTE (totalRounds).
    stats.campCompletati = Object.keys(champRounds).filter(function(cid){
      var champ = calendario.find(function(c){ return c.id === cid; });
      var totalRounds = champTotalRounds[cid] || 0;
      var required = (champ && champ.bestOf) ? parseInt(champ.bestOf) : totalRounds;
      var attended = Object.keys(champRounds[cid]).length;
      return required > 0 && attended >= required;
    }).length;
    stats.globetrotter = Object.keys(circuitiSet).length;
    stats.multicat = Object.keys(categorieSet).length;

    // Presenza Perfetta: CAMPAGNE (Campionato/Formula) completate al 100% dei
    // round, dove una campagna può comprendere più campionati con lo stesso
    // valore "campagna" + stessa Stagione Ufficiale (es. "Estiva" + "Stagione
    // 2"). Serve 100% di presenza su TUTTI i round di TUTTI i campionati di
    // quella campagna. Campionati senza "campagna" impostata vengono ignorati
    // (dato non ancora migrato) — non contano né a favore né contro.
    var campagnaGroups = {}; // key -> { total, attended }
    Object.keys(champRounds).forEach(function(cid){
      var champ = calendario.find(function(c){ return c.id === cid; });
      if (!champ || (champ.cat !== 'Campionato' && champ.cat !== 'Formula')) return;
      var campagnaVal = (champ.campagna || '').trim();
      var stagioneVal = (champ.stagione || '').trim();
      if (!campagnaVal || !stagioneVal) return;
      var key = campagnaVal.toLowerCase() + '|' + stagioneVal.toLowerCase();
      if (!campagnaGroups[key]) campagnaGroups[key] = { total: 0, attended: 0 };
      campagnaGroups[key].total += (champTotalRounds[cid] || 0);
      campagnaGroups[key].attended += Object.keys(champRounds[cid]).length;
    });
    stats.presenzaPerfetta = Object.keys(campagnaGroups).filter(function(k){
      var g = campagnaGroups[k];
      return g.total > 0 && g.attended >= g.total;
    }).length;

    // Costanza: miglior serie di gare consecutive senza ritiro (dnf/dsq)
    raceLog = raceLog.filter(function(r){ return r.date; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    var best = 0, cur = 0;
    raceLog.forEach(function(r){
      if (r.stato === 'ok') { cur++; if (cur > best) best = cur; }
      else cur = 0;
    });
    stats.costanza = best;

    // Veterano: anni di appartenenza CUMULATIVI da attivo — i periodi in cui il
    // pilota è stato "Non Attivo" non contano. Se torna attivo, il conteggio
    // riprende da dove era rimasto (non riparte da zero).
    var earliestDate = null;
    raceLog.forEach(function(r){ if (r.date && (!earliestDate || r.date < earliestDate)) earliestDate = r.date; });
    stats.veterano = computeVeteranoAnni(pilot, earliestDate);

    var autoUnica = {
      primaVittoriaPersonale: stats.vittorie >= 1
    };
    var pilotBadges = (pilot.badges || []).map(function(b){ return String(b).toLowerCase().trim(); });

    // ---- Render ----
    var nome = pilot.nome || pilot.name || '—';
    var psnDisp = pilot.psn || '';
    var foto = pilot.foto || pilot.photo || null;
    var photoHtml = foto ? '<img src="' + esc(foto) + '" alt="' + esc(nome) + '">' : '<div class="fallback">🪖</div>';

    var html = ''
      + '<div class="profile">'
      +   photoHtml
      +   '<div>'
      +     '<div class="profile-name">' + esc(nome) + '</div>'
      +     (psnDisp ? '<div class="profile-psn">' + esc(psnDisp) + '</div>' : '')
      +     '<div class="profile-sub">' + stats.gare + ' gare disputate · ' + stats.vittorie + ' vittorie · ' + stats.podi + ' podi</div>'
      +   '</div>'
      + '</div>';

    CATALOG.forEach(function(section, si){
      html += '<div class="section"><div class="section-head"><span class="n">' + String(si+1).padStart(2,'0') + '</span><h2>' + esc(section.cat) + '</h2><span class="sub">' + section.items.length + ' distintivi</span></div>';
      html += '<div class="badge-grid">';
      section.items.forEach(function(def){
        if (def.type === 'tiered') html += renderTieredCard(def, stats[def.key] || 0, def.key === 'multicat' ? renderCatAutoChips(categorieSet) : '');
        else if (def.type === 'auto') html += renderUnicaCard(def, !!autoUnica[def.key]);
        else html += renderUnicaCard(def, pilotBadges.indexOf(def.key) !== -1);
      });
      html += '</div></div>';
    });

    html += '<footer>Distintivi con progresso calcolati automaticamente dai risultati gara pubblicati sul sito. I distintivi manuali sono assegnati dal club tramite la scheda pilota.</footer>';

    root.innerHTML = html;

  } catch (err) {
    console.error(err);
    root.innerHTML = '<div class="state">Impossibile caricare i dati dei distintivi.<br>Riprova più tardi.</div>';
  }
}

main();
</script>
</body>
</html>
